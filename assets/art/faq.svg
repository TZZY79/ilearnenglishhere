<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
<title id="t">A student with a question mark that turns into a bright idea</title>
<style>
  .q{transform-box:fill-box;transform-origin:50% 100%;animation:qbounce 4s ease-in-out infinite}
  @keyframes qbounce{0%,100%{transform:translateY(0) rotate(-6deg);opacity:1}20%{transform:translateY(-12px) rotate(6deg)}40%{transform:translateY(0) rotate(-4deg);opacity:1}50%,90%{opacity:0}}
  .idea{transform-box:fill-box;transform-origin:50% 100%;animation:idea 4s ease-in-out infinite}
  @keyframes idea{0%,45%{transform:scale(0);opacity:0}55%,88%{transform:scale(1);opacity:1}96%,100%{transform:scale(0);opacity:0}}
  .hand{transform-box:fill-box;transform-origin:50% 100%;animation:raise 4s ease-in-out infinite}
  @keyframes raise{0%,40%{transform:rotate(0)}50%,85%{transform:rotate(-8deg) translateY(-6px)}100%{transform:rotate(0)}}
  .mini{animation:float 3s ease-in-out infinite alternate}.mi2{animation-delay:-1.5s}
  @keyframes float{from{transform:translateY(0)}to{transform:translateY(-10px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.idea{opacity:0}}
</style>
<rect width="400" height="300" rx="24" fill="#f7ecf5"/>
<text class="mini" x="60" y="90" font-family="Georgia,serif" font-size="30" font-weight="700" fill="#1f7a6c" opacity=".5">?</text>
<text class="mini mi2" x="320" y="120" font-family="Georgia,serif" font-size="26" font-weight="700" fill="#e0a548" opacity=".6">?</text>
<text class="mini" x="330" y="230" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#1f7a6c" opacity=".4">!</text>
<!-- big question mark -->
<text class="q" x="250" y="130" font-family="Georgia,serif" font-size="96" font-weight="700" fill="#e0a548">?</text>
<!-- idea bulb -->
<g class="idea">
  <circle cx="276" cy="80" r="30" fill="#ffd66b" stroke="#e0a548" stroke-width="4"/>
  <rect x="264" y="108" width="24" height="12" rx="3" fill="#7d938f"/>
  <path d="M276 40v-12M240 80h-12M312 80h12M250 54l-8-8M302 54l8-8" stroke="#e0a548" stroke-width="4" stroke-linecap="round"/>
</g>
<!-- student -->
<rect x="130" y="190" width="90" height="110" rx="34" fill="#1f7a6c"/>
<g class="hand">
  <rect x="200" y="120" width="18" height="80" rx="9" fill="#1f7a6c"/>
  <circle cx="209" cy="118" r="11" fill="#c98e62"/>
</g>
<circle cx="175" cy="160" r="36" fill="#c98e62"/>
<path d="M139 156c0-24 16-38 36-38s36 14 36 38c-6-11-18-16-36-16s-30 5-36 16z" fill="#2b1d14"/>
<circle cx="164" cy="164" r="3.5" fill="#132a2e"/><circle cx="188" cy="164" r="3.5" fill="#132a2e"/>
<ellipse cx="176" cy="180" rx="6" ry="5" fill="#5a1f1f"/>
</svg>
