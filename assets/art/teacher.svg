<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
<title id="t">A teacher pointing at a whiteboard while words appear on it</title>
<style>
  .line{stroke-dasharray:160;stroke-dashoffset:160;animation:write 6s ease-in-out infinite}
  .l2{animation-delay:.8s}.l3{animation-delay:1.6s}
  @keyframes write{0%{stroke-dashoffset:160}25%,80%{stroke-dashoffset:0}95%,100%{stroke-dashoffset:160}}
  .arm{transform-box:fill-box;transform-origin:95% 90%;animation:point 3s ease-in-out infinite}
  @keyframes point{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
  .bubble{transform-box:fill-box;transform-origin:0% 100%;animation:pop 3s ease-in-out infinite}
  @keyframes pop{0%,15%{transform:scale(0);opacity:0}25%,70%{transform:scale(1);opacity:1}85%,100%{transform:scale(0);opacity:0}}
  .star{transform-box:fill-box;transform-origin:center;animation:twinkle 2.2s ease-in-out infinite}
  .s2{animation-delay:.7s}.s3{animation-delay:1.4s}
  @keyframes twinkle{0%,100%{transform:scale(.6);opacity:.3}50%{transform:scale(1.1);opacity:1}}
  .head{transform-box:fill-box;transform-origin:50% 100%;animation:nod 3s ease-in-out infinite}
  @keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(3deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.line{stroke-dashoffset:0}.bubble{opacity:1}}
</style>
<rect width="400" height="300" rx="24" fill="#e8f4f1"/>
<!-- board -->
<rect x="40" y="40" width="210" height="140" rx="10" fill="#fff" stroke="#1f7a6c" stroke-width="6"/>
<rect x="120" y="180" width="50" height="8" fill="#1f7a6c"/>
<text x="58" y="78" font-family="Georgia,serif" font-size="26" font-weight="700" fill="#e0a548">ABC</text>
<path class="line" d="M58 102 H230" stroke="#132a2e" stroke-width="5" stroke-linecap="round" fill="none"/>
<path class="line l2" d="M58 124 H200" stroke="#1f7a6c" stroke-width="5" stroke-linecap="round" fill="none"/>
<path class="line l3" d="M58 146 H215" stroke="#132a2e" stroke-width="5" stroke-linecap="round" fill="none"/>
<!-- stars -->
<path class="star" d="M180 60l4 9 9 1-7 6 2 9-8-5-8 5 2-9-7-6 9-1z" fill="#e0a548"/>
<path class="star s2" d="M350 60l3 7 7 1-5 4 1 7-6-4-6 4 1-7-5-4 7-1z" fill="#e0a548"/>
<path class="star s3" d="M30 220l3 7 7 1-5 4 1 7-6-4-6 4 1-7-5-4 7-1z" fill="#1f7a6c"/>
<!-- teacher -->
<g>
  <rect x="268" y="150" width="62" height="95" rx="24" fill="#1f7a6c"/>
  <rect x="276" y="240" width="18" height="40" rx="8" fill="#132a2e"/>
  <rect x="304" y="240" width="18" height="40" rx="8" fill="#132a2e"/>
  <g class="arm">
    <rect x="215" y="150" width="62" height="16" rx="8" fill="#1f7a6c"/>
    <circle cx="215" cy="158" r="9" fill="#c98e62"/>
    <path d="M208 156 L160 128" stroke="#8a5a2b" stroke-width="5" stroke-linecap="round"/>
  </g>
  <rect x="318" y="160" width="16" height="60" rx="8" fill="#1f7a6c"/>
  <g class="head">
    <circle cx="299" cy="122" r="28" fill="#c98e62"/>
    <path d="M271 118c0-20 12-32 28-32s28 12 28 32c-6-10-16-14-28-14s-22 4-28 14z" fill="#3b2a1e"/>
    <circle cx="289" cy="124" r="3" fill="#132a2e"/><circle cx="309" cy="124" r="3" fill="#132a2e"/>
    <path d="M290 136q9 8 18 0" stroke="#132a2e" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
</g>
<!-- speech bubble -->
<g class="bubble">
  <rect x="318" y="44" width="72" height="40" rx="14" fill="#fff" stroke="#e0a548" stroke-width="3"/>
  <path d="M326 82 l-6 14 16-12z" fill="#fff" stroke="#e0a548" stroke-width="3" stroke-linejoin="round"/>
  <text x="354" y="70" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="15" font-weight="700" fill="#132a2e">Hello!</text>
</g>
</svg>
