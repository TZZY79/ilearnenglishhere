<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-labelledby="t">
<title id="t">An open book with pages turning and words flying out</title>
<style>
  .page{transform-box:view-box;transform-origin:200px 0;animation:flip 3s ease-in-out infinite}
  .pg2{animation-delay:1.5s}
  @keyframes flip{0%,10%{transform:scaleX(1)}50%{transform:scaleX(0)}51%{transform:scaleX(-.001)}90%,100%{transform:scaleX(-1)}}
  .word{animation:fly 4.5s ease-out infinite;opacity:0}
  .w2{animation-delay:1.5s}.w3{animation-delay:3s}
  @keyframes fly{0%{transform:translate(0,0) scale(.6);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translate(var(--dx),-120px) scale(1.1);opacity:0}}
  .spark{transform-box:fill-box;transform-origin:center;animation:spin 5s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}.word{opacity:1}}
</style>
<rect width="400" height="300" rx="24" fill="#eaf5ea"/>
<text class="word" style="--dx:-80px" x="180" y="170" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#1f7a6c">happy</text>
<text class="word w2" style="--dx:10px" x="175" y="170" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#e0a548">because</text>
<text class="word w3" style="--dx:90px" x="185" y="170" font-family="Georgia,serif" font-size="22" font-weight="700" fill="#132a2e">yesterday</text>
<path class="spark" d="M60 60l5 12 12 5-12 5-5 12-5-12-12-5 12-5z" fill="#e0a548"/>
<path class="spark" style="animation-direction:reverse" d="M340 70l4 9 9 4-9 4-4 9-4-9-9-4 9-4z" fill="#1f7a6c"/>
<!-- book -->
<path d="M200 190 C160 170 110 170 70 180 V260 C110 250 160 250 200 270z" fill="#1f7a6c"/>
<path d="M200 190 C240 170 290 170 330 180 V260 C290 250 240 250 200 270z" fill="#145247"/>
<path d="M200 186 C165 168 120 166 82 174 V250 C120 244 165 246 200 262z" fill="#fff"/>
<path d="M200 186 C235 168 280 166 318 174 V250 C280 244 235 246 200 262z" fill="#fdfaf2"/>
<g stroke="#dbe8e5" stroke-width="3" stroke-linecap="round">
  <path d="M100 192h80M100 206h70M100 220h80M100 234h60"/>
  <path d="M220 192h80M230 206h70M220 220h80M240 234h60"/>
</g>
<path class="page" d="M200 186 C235 168 280 166 318 174 V250 C280 244 235 246 200 262z" fill="#fff" stroke="#e8e2d0" stroke-width="1.5"/>
<path class="page pg2" d="M200 186 C235 168 280 166 318 174 V250 C280 244 235 246 200 262z" fill="#fffdf6" stroke="#e8e2d0" stroke-width="1.5"/>
</svg>
