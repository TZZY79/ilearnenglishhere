<div id="mk"><noscript><p style="padding:1rem">This interactive lesson needs JavaScript. Please open it in Chrome, Firefox or Safari.</p></noscript></div>
<script>
window.MISSION = {
  id: "britain-1", file: "britain-1.html", mission: "britain", part: 1, min: 25, title: "The Great British Adventure 🇬🇧", level: "B2", next: "creator", nextUrl: "creator-1.html",
  desc: "Plan a real trip from London to Bath, Bristol and Edinburgh using real websites.",
  test: [
   {t:"mc",q:"Which is the most polite question at a train ticket office?",o:["Give me a ticket to Bath.","Could you tell me what time the next train to Bath leaves?","When train Bath?","You tell me the train time."],a:1,why:"“Could you tell me…” is polite and indirect — perfect for strangers and staff."},
   {t:"mc",q:"Choose the correct indirect question: “Do you know where ______?”",o:["is the station","the station is","is station the","the station"],a:1,why:"In indirect questions the word order is normal: subject + verb → the station is."},
   {t:"mc",q:"You are writing to a hotel and you don't know the person's name. How do you start?",o:["Hi there,","Dear Sir or Madam,","Hey hotel,","To my friend,"],a:1,why:"“Dear Sir or Madam” is the formal opening when you don't know the name."},
   {t:"mc",q:"If you start “Dear Sir or Madam”, how should you end the letter?",o:["Yours sincerely,","Yours faithfully,","Cheers,","Love,"],a:1,why:"British rule: unknown name → Yours faithfully; known name → Yours sincerely."},
   {t:"mc",q:"Timetables: “The museum ______ at 9 a.m. every day.”",o:["opens","is opening","opened","open"],a:0,why:"Timetables and fixed schedules use the present simple: opens."},
   {t:"mc",q:"“If the train is late, we ______ a taxi.”",o:["will take","would take","took","taking"],a:0,why:"First conditional (real possibility): If + present, will + verb."},
   {t:"gap",q:"Complete: “Last summer we ______ (go) to Edinburgh.”",acc:["went"],why:"Go is irregular: go → went → gone."},
   {t:"mc",q:"Which adjective best describes a room that is small but warm and comfortable?",o:["cosy","cramped","spacious","filthy"],a:0,why:"Cosy = small in a nice way. Cramped = small in a bad way."},
   {t:"web",q:"🌐 Search online: What is the name of the famous castle on a rock in the centre of Edinburgh?",acc:["edinburgh castle"],hint:"Search: “castle on the rock Edinburgh”.",why:"Edinburgh Castle sits on Castle Rock, an old volcano."},
   {t:"write",q:"✍️ Write a polite question to a hotel asking about breakfast times (at least 8 words, end with ?).",min:8,max:60,must:/breakfast/i,end:"?",why:"You need the word “breakfast”, at least 8 words and a question mark."}
  ],
  glossary: [
    ["return ticket", "a ticket to go somewhere and come back (US: round trip)"], ["single ticket", "a ticket for one direction only"],
    ["off-peak", "cheaper times to travel, when trains are less busy"], ["railcard", "a card that gives you about 1/3 off train tickets"],
    ["platform", "the place in a station where you get on the train"], ["B&B", "bed and breakfast — a small, often family-run guest house"],
    ["en-suite", "a bedroom with its own private bathroom"], ["enquiry", "a question asking for information (formal)"],
    ["Georgian", "the style of buildings from about 1714–1830 in Britain"], ["itinerary", "a plan of your journey: places, dates and times"],
    ["admission", "the price or permission to enter a museum or attraction"], ["landmark", "a famous building or place that is easy to recognise"],
    ["recommend", "to say something is good and suggest it"], ["budget", "the amount of money you plan to spend"]
  ],
  steps: [
    { t: "intro", emoji: "🧳", title: "Your British adventure starts now", html: "<p>You have won a <b>10-day trip around Britain</b>. Your route: <b>London → Bath → Bristol → Edinburgh</b>. But there is a catch: <i>you</i> must plan everything — in English, using real British websites.</p><p>There are 4 quests. Each one teaches a language skill first, then sends you to research real information.</p>",
      goals: ["ask polite and indirect travel questions", "read real train and attraction websites", "write a formal enquiry email to a B&B", "use tenses correctly for timetables and plans", "write a short travel report"],
      how: "<p>Look for the <b>🔎 Research Lab</b> on research steps. It searches an online encyclopedia for you, gives you trusted British websites, and has buttons for web search, YouTube, translation and an AI explainer.</p>" },
    { t: "teach", kicker: "Quest 1 · London", emoji: "🚆", title: "Mastering travel questions", html: "<p>In Britain, people are very polite with staff and strangers. Direct questions can sound rude.</p>",
      formula: "Direct: <b>Where is platform 4?</b><br>Polite (indirect): <b>Could you tell me where platform 4 is?</b> ← verb moves to the END",
      vocab: [["Could you tell me…?", "the most useful polite opener", "Could you tell me when the next train leaves?"], ["Do you know if…?", "for yes/no questions", "Do you know if this train stops at Bath?"], ["I was wondering…", "extra polite", "I was wondering whether there are any cheaper tickets."]],
      reveal: [["Make it polite: “How much is a return to Bath?”", "Could you tell me how much a return ticket to Bath is?"], ["Make it polite: “Does this train have Wi-Fi?”", "Do you know if this train has Wi-Fi?"]],
      tip: "Brits also say “Sorry…” to start a question to a stranger: “Sorry, could you tell me…?”" },
    { t: "mcq", kicker: "Quest 1 · Check", q: "Which question is correct AND polite?", o: ["Could you tell me where is the ticket office?", "Could you tell me where the ticket office is?", "Where the ticket office is?", "Tell me where is ticket office."], a: 1, why: "In indirect questions the word order is normal: the ticket office (subject) + is (verb)." },
    { t: "research", kicker: "Quest 1 · Research", emoji: "🔎", title: "The great train race: London to Bath",
      task: "Find out how to travel from <b>London</b> to <b>Bath</b> by train. Write <b>3–4 sentences</b> including:<ul><li>the London station trains leave from</li><li>roughly how long the journey takes</li><li>the train company</li><li>one way to save money</li></ul>",
      steps: ["Use the National Rail journey planner (link below). From: London · To: Bath Spa.", "Look at journey time and the station name.", "Look for words like Off-Peak, Advance or Railcard.", "Write your answer with the sentence starters."],
      queries: ["London to Bath Spa train", "Great Western Railway", "London Paddington station", "Railcard UK"],
      sources: [["National Rail — journey planner", "https://www.nationalrail.co.uk/", "Official times and fares for all British trains"], ["GWR (Great Western Railway)", "https://www.gwr.com/", "The train company that runs London–Bath trains"], ["Railcards", "https://www.railcard.co.uk/", "Discount cards, e.g. 16–25 Railcard"]],
      starters: ["Trains to Bath leave from…", "The journey takes about…", "The trains are run by…", "To save money, you can…"], minWords: 40,
      model: "Trains to Bath Spa leave from London Paddington. The journey takes about 1 hour 20 minutes. The trains are run by Great Western Railway (GWR). To save money, you can book an Advance ticket early, travel Off-Peak, or use a Railcard to get around a third off." },
    { t: "speak", kicker: "Quest 1 · Speak", title: "At the ticket office", task: "Record yourself buying a ticket. Use <b>2 indirect questions</b>.", model: "Good morning. Sorry, could you tell me how much an off-peak return to Bath Spa is? And do you know which platform the next train leaves from? Thank you very much.", checklist: ["A greeting", "2 indirect questions", "Please / thank you"] },
    { t: "teach", kicker: "Quest 2 · Bath", emoji: "🏛️", title: "Formal enquiries and descriptive power", html: "<p>Bath is a UNESCO World Heritage city famous for its <b>Roman Baths</b> and golden <b>Georgian</b> buildings. Now you need a place to stay.</p>",
      vocab: [["charming", "pleasant and attractive", "a charming B&B"], ["spacious", "with lots of space", "a spacious room"], ["conveniently located", "in a useful place", "conveniently located near the station"], ["cosy", "small, warm and comfortable", "a cosy lounge"]],
      formula: "Formal email: <b>Dear Sir or Madam,</b> → reason → questions → <b>I look forward to hearing from you.</b> → <b>Yours faithfully,</b><br>If you know the name: <b>Dear Ms Smith,</b> … <b>Yours sincerely,</b>",
      reveal: [["Informal → formal: “I want to know if you have a room.”", "I would like to enquire whether you have a room available."], ["Informal → formal: “Can you send me the price?”", "Could you please let me know the price?"]] },
    { t: "research", kicker: "Quest 2 · Research", emoji: "🛏️", title: "B&B description challenge",
      task: "Find a <b>real B&B or small hotel in Bath</b> on a booking or tourism site. Describe it in <b>4–5 sentences</b> using at least <b>3 descriptive adjectives</b>. Include the price per night (roughly) and one thing guests like.",
      steps: ["Open Visit Bath's accommodation page (or any booking site).", "Choose one B&B. Read the description and 2 guest reviews.", "Note: location, price, room, breakfast.", "Write your description with adjectives from the Key words."],
      queries: ["Bath England", "bed and breakfast", "Georgian architecture"],
      sources: [["Visit Bath — where to stay", "https://visitbath.co.uk/", "The city's official tourism website"], ["Booking.com — Bath", "https://www.booking.com/city/gb/bath.html", "Prices and real guest reviews"]],
      vocab: [["charming / elegant / cosy / spacious / quiet / modern", "useful adjectives"], ["within walking distance of", "near enough to walk", "within walking distance of the Roman Baths"]],
      starters: ["I found a charming B&B called…", "It is located…", "The rooms are…", "Guests love the…", "A double room costs about…"], minWords: 45,
      model: "I found a charming B&B called The Abbey Rooms. It is located in a quiet street within walking distance of the Roman Baths. The rooms are spacious and elegant, and some have views of the hills. Guests love the homemade breakfast. A double room costs about £140 per night." },
    { t: "write", kicker: "Quest 2 · Write", emoji: "📧", title: "Formal enquiry email", task: "Write a <b>formal email</b> to the B&B you found (70–150 words). Ask about: <b>availability</b> for 2 nights, <b>breakfast</b>, and <b>parking or the distance from the station</b>.",
      frame: "Dear Sir or Madam,\n\nI am writing to enquire about \n\n\nI look forward to hearing from you.\n\nYours faithfully,\n",
      auto: [{ has: /dear (sir|madam|mr|mrs|ms|miss)/i, msg: "A formal greeting (Dear Sir or Madam / Dear Ms …)" }, { has: /yours (faithfully|sincerely)/i, msg: "A formal ending (Yours faithfully / sincerely)" }, { has: /breakfast/i, msg: "Ask about breakfast" }, { has: /\?/, msg: "At least one question mark" }], minWords: 70, maxWords: 170,
      checklist: ["No contractions (I'm → I am)", "Polite phrases: Could you…? I would be grateful if…", "Dates are clear (e.g. 14–16 May)"],
      model: "Dear Sir or Madam,<br><br>I am writing to enquire about the availability of a double room for two nights, from 14 to 16 May. Could you please confirm whether breakfast is included in the price? I would also be grateful if you could tell me how far the B&B is from Bath Spa station, as I will be arriving by train.<br><br>I look forward to hearing from you.<br><br>Yours faithfully,<br>Maria Lopez" },
    { t: "teach", kicker: "Quest 3 · Bristol", emoji: "🎨", title: "Scheduling with tenses", html: "<p>Bristol is a creative city with a famous harbour, street art and the Clifton Suspension Bridge. To plan your day you need three tenses:</p>",
      vocab: [["Present simple", "timetables & opening times", "The museum opens at 10 a.m."], ["Past simple", "what happened / history", "The bridge opened in 1864."], ["First conditional", "real future possibilities", "If it rains, we will visit the museum."]],
      reveal: [["Correct it: “The museum is opening at 10 every day.”", "The museum opens at 10 every day. (timetable → present simple)"], ["Complete: If we ___ (have) time, we ___ (see) the bridge.", "If we have time, we will see the bridge."]] },
    { t: "gap", kicker: "Quest 3 · Check", q: "“The Clifton Suspension Bridge ______ (open) in 1864.”", acc: ["opened", "was opened"], why: "A finished past event → past simple: opened." },
    { t: "research", kicker: "Quest 3 · Research", emoji: "🕰️", title: "Museum times & history", task: "Choose <b>one attraction in Bristol</b> (e.g. the SS Great Britain, M Shed, Bristol Museum & Art Gallery or the Clifton Suspension Bridge). Write <b>4 sentences</b>: 1) when it opens (present simple), 2) how much it costs, 3) one fact from its history (past simple), 4) a plan with <b>If…, I will…</b>",
      queries: ["SS Great Britain", "Clifton Suspension Bridge", "Isambard Kingdom Brunel", "M Shed Bristol"],
      sources: [["Visit Bristol", "https://visitbristol.co.uk/", "Official guide to attractions"], ["Brunel's SS Great Britain", "https://www.ssgreatbritain.org/", "Opening times and history"], ["Bristol Museums (M Shed, Museum & Art Gallery)", "https://www.bristolmuseums.org.uk/", "Free museums — times and events"]],
      auto: [{ has: /\bif\b[^.]*\bwill\b/i, msg: "A first conditional (If…, I will…)" }, { sentences: 4 }], minWords: 45,
      starters: ["It opens at…", "Tickets cost…", "It was built in…", "If the weather is good, I will…"],
      model: "Brunel's SS Great Britain opens at 10 a.m. every day. Adult tickets cost about £25 and you can return free for a year. The ship was designed by Isambard Kingdom Brunel and launched in 1843. If the weather is good, I will walk along the harbour after my visit." },
    { t: "video", kicker: "Quest 3 · Watch", title: "Street art in Bristol", task: "Watch one short video about street art in Bristol. Write <b>3 things you learned</b> and <b>1 opinion</b> (Do you think street art is art?).", search: "Bristol street art walking tour", minWords: 35, starters: ["I learned that…", "I was surprised that…", "In my opinion, street art…"] },
    { t: "teach", kicker: "Quest 4 · Edinburgh", emoji: "🏰", title: "Writing a travel report", html: "<p>Your final stop is Edinburgh, Scotland's capital. A good report is clear and organised:</p>",
      formula: "<b>Title</b> → <b>Introduction</b> (where & why) → <b>Highlights</b> (2–3 places) → <b>Practical tips</b> (transport, money) → <b>Recommendation</b>",
      vocab: [["highlight", "the best part", "The highlight was the castle."], ["breathtaking", "extremely beautiful", "breathtaking views"], ["I would highly recommend…", "strong recommendation phrase"], ["worth visiting", "good enough to visit", "The museum is well worth visiting."]] },
    { t: "research", kicker: "Quest 4 · Final report", emoji: "📊", title: "Edinburgh final report", task: "Research Edinburgh and write a <b>travel report (110–200 words)</b> with the 5 parts: title, introduction, 2–3 highlights, practical tips, recommendation. Include <b>at least one real fact or number</b> you found.",
      queries: ["Edinburgh Castle", "Royal Mile", "Arthur's Seat", "Edinburgh Festival Fringe", "London to Edinburgh train"],
      sources: [["Edinburgh Castle (official)", "https://www.edinburghcastle.scot/", "Tickets, history and opening times"], ["VisitScotland — Edinburgh", "https://www.visitscotland.com/places-to-go/edinburgh", "Scotland's official tourism site"], ["National Rail", "https://www.nationalrail.co.uk/", "London King's Cross to Edinburgh Waverley"]],
      auto: [{ digit: true }, { has: /recommend/i, msg: "A recommendation (I would recommend…)" }], minWords: 110, maxWords: 220,
      starters: ["Edinburgh: A City of Castles and Culture", "Edinburgh is the capital of Scotland and…", "The highlight of my visit was…", "A practical tip is to…", "I would highly recommend…"],
      model: "<b>Edinburgh: Castles, Hills and History</b><br>Edinburgh is the capital of Scotland and one of the most beautiful cities in Europe. The train from London King's Cross takes about four and a half hours. The highlight was Edinburgh Castle, which sits on an ancient volcano called Castle Rock. From there, I walked down the Royal Mile, a long street full of shops and street performers, to the Palace of Holyroodhouse. On my last day I climbed Arthur's Seat, a 251-metre hill with breathtaking views. A practical tip is to book castle tickets online, because it is often busy, especially in August during the Festival Fringe. I would highly recommend Edinburgh to anyone who loves history and walking." },
    { t: "summary", title: "Adventure complete!", points: ["ask polite indirect questions", "use real British travel websites", "write a formal enquiry email", "use present simple, past simple and the first conditional", "write an organised travel report"] }
  ]
};
</script>
