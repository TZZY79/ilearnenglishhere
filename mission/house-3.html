<script>
window.MISSION = {
  id: "house-3", file: "house-3.html", mission: "house", part: 3, min: 50, title: "Buying a Home in England · Series 3: Exchange & Completion 🔑", level: "C2 · Final mission", next: "", nextUrl: "../mission.html",
  desc: "The final boss — weeks 7 to 12: exchange, a chain crisis, the TR1, Stamp Duty, completion day and life after the keys.",
  test: [
   {t:"mc",q:"“Exchange of contracts” is the moment when…",o:["the sale becomes legally binding","you first view the house","you get the keys","the estate agent puts up a sign"],a:0,why:"Before exchange, either side can pull out. After exchange, they are committed."},
   {t:"mc",q:"“Completion” is…",o:["the day the money is transferred and you get the keys","the day you make an offer","the house survey","the end of the mortgage"],a:0,why:"Completion day = moving day for most buyers."},
   {t:"mc",q:"What usually happens if a buyer pulls out AFTER exchange?",o:["They can lose their deposit and may be sued","Nothing at all","They get a refund plus interest","The seller pays a fine"],a:0,why:"That's why exchange is such a big step."},
   {t:"mc",q:"SDLT stands for…",o:["Stamp Duty Land Tax","Standard Deposit Loan Total","Survey, Deeds, Legal, Transfer","Seller's Document of Land Title"],a:0,why:"SDLT is a tax paid when buying property in England above certain prices."},
   {t:"mc",q:"Use the internet if you need to: the TR1 form is used to…",o:["transfer ownership of a registered property","apply for a mortgage","report a broken boiler","book a removal van"],a:0,why:"TR1 = Transfer of whole of registered title."},
   {t:"mc",q:"“Completion was set for noon, but the funds didn't arrive until 3 p.m., so the keys were released late.” Why were the keys late?",o:["The money transfer was delayed","The buyer lost the keys","The estate agent was ill","The house was not built"],a:0,why:"Keys are only released when the seller receives the money."},
   {t:"gap",q:"“Once contracts are exchanged, both parties are legally ______ to complete.”",acc:["bound","obliged","committed","obligated"],why:"Legally bound = the law says you must do it."},
   {t:"mc",q:"“The vendor's solicitor has confirmed receipt of funds.” In plain English:",o:["The seller's lawyer says the money has arrived.","The buyer's bank has closed.","The seller wants more money.","The lawyer has lost the receipt."],a:0,why:"Vendor = seller · receipt of funds = the money was received."},
   {t:"web",q:"🌐 Search online (GOV.UK): In England, how many days after completion do you have to send your Stamp Duty Land Tax return? (number)",acc:["14","14 days","fourteen"],hint:"Search: “SDLT return how many days after completion gov.uk”.",why:"You have 14 days after completion to file the SDLT return and pay."},
   {t:"write",q:"✍️ Summarise what happens on completion day in at least 3 sentences (40+ words). Use a sequencing word (first, then, next, after that, finally).",min:40,max:250,sentences:3,must:/\b(first|then|next|after that|finally|afterwards)\b/i,why:"40+ words, 3+ sentences and at least one sequencing word."}
  ],
  glossary: [
    ["exchange of contracts", "the moment the sale becomes legally binding — both sides are committed"], ["completion", "the day the money is transferred and the buyer gets the keys"],
    ["completion date", "the date agreed at exchange for moving"], ["exchange deposit", "money the buyer pays at exchange (often 10% or an agreed amount)"],
    ["legally binding", "you must do it by law"], ["pull out / withdraw", "stop the purchase or sale"], ["TR1", "the transfer deed that moves ownership of a registered property"],
    ["witness", "a person who watches you sign and signs too"], ["CHAPS", "a same-day bank transfer used for large payments"], ["funds", "money"],
    ["redeem (a mortgage)", "pay off a mortgage completely"], ["meter reading", "the number on your gas, electricity or water meter"],
    ["council tax", "a local tax paid by people who live in a home"], ["register (with HM Land Registry)", "officially record the new owner"], ["contingency", "a backup plan or money for problems"]
  ],
  steps: [
    { t: "intro", emoji: "🔑", title: "Series 3: the final stretch", html: "<p>This is the <b>final mission</b> — the hardest on the site. Sarah is ready to exchange. James's chain is in trouble. In weeks 7–12 you'll learn the language of contracts, deadlines, money transfers and crisis management.</p>",
      goals: ["explain exchange and completion precisely", "manage a crisis with diplomatic but firm English", "understand the TR1 and Stamp Duty returns", "follow a completion-day timeline", "summarise a complex process clearly"] },
    { t: "teach", kicker: "Week 7", emoji: "📋", title: "Understanding exchange of contracts", html: "<p>Before exchange, either side can pull out with no penalty. <b>After exchange, both are legally bound.</b></p>",
      vocab: [["At exchange", "the solicitors swap signed contracts (usually by phone, recorded)"], ["The deposit", "the buyer pays an agreed deposit (often 10%) to the seller's solicitor"], ["The completion date", "is fixed in the contract"], ["Insurance", "the buyer usually needs buildings insurance from exchange"]],
      formula: "If the <b>buyer</b> pulls out after exchange → they can lose the deposit and may be sued for losses.<br>If the <b>seller</b> pulls out → the buyer can claim compensation.",
      reveal: [["Why do chains try to exchange on the same day?", "So nobody becomes legally bound to buy without being sure their own sale is also bound."]] },
    { t: "story", kicker: "Week 7", emoji: "😰", title: "James's chain crisis", html: "<p>Disaster: after the down-valuation, Tom and Aisha's lender will only lend on £240,000. They can't find the extra £5,000 — so they <b>withdraw</b>. James has no buyer. The Bennetts give him <b>three weeks</b> to find a new buyer before they put their house back on the market.</p><p>James has three choices: <b>reduce his price</b>, <b>find a new buyer fast</b>, or <b>ask for more time</b>.</p>",
      vocab: [["withdraw", "stop being part of the sale"], ["back on the market", "advertised for sale again"]] },
    { t: "write", kicker: "Week 7 · Crisis email", emoji: "🧯", title: "James asks for time", task: "Write James's email to the Bennetts' estate agent (110–160 words). Be <b>diplomatic but firm</b>: explain what happened, show you are still committed, give your plan (price reduced to £239,950, extra marketing) and ask for <b>4 weeks</b> instead of 3.",
      frame: "Dear Ms Clarke,\n\nRe: 5 Oak Drive\n\n",
      auto: [{ has: /(commit|keen|determined)/i, msg: "Shows commitment" }, { has: /\b(4|four)( weeks)?\b/i, msg: "Asks for 4 (four) weeks" }, { has: /(I would be grateful|I would appreciate|could you|would it be possible)/i, msg: "A polite request phrase" }], minWords: 110, maxWords: 170,
      model: "Dear Ms Clarke,<br><br>Re: 5 Oak Drive<br><br>I am writing to update you on my situation. Unfortunately, my buyers have withdrawn after their lender valued my house below the agreed price. I want to reassure Mr and Mrs Bennett that I remain fully committed to buying their home.<br><br>I have already taken action: my house is back on the market at £239,950, which matches the valuation, and my agent is contacting buyers who viewed it last month. We have three viewings booked this week.<br><br>Would it be possible to extend the deadline from three weeks to four? I would be very grateful for this flexibility, and I will keep you updated every few days.<br><br>Kind regards,<br>James Walker" },
    { t: "story", kicker: "Week 8", emoji: "🎉", title: "Sarah exchanges contracts!", html: "<p>Sarah's solicitor calls: the searches are clear, the seller has fixed the leaking pipe, the mortgage offer is ready. Sarah signs her contract and the <b>mortgage deed</b>, transfers her deposit, and arranges <b>buildings insurance</b>. At 3:15 p.m. the solicitors <b>exchange by phone</b>. Completion is fixed for <b>Friday in three weeks' time</b>.</p>",
      reveal: [["From this moment, what happens if Sarah changes her mind?", "She could lose her deposit and be responsible for the seller's losses — she is legally bound."]] },
    { t: "teach", kicker: "Week 8–9", emoji: "📜", title: "The TR1 — transfer of land", vocab: [["TR1", "‘Transfer of whole of registered title’ — the deed that transfers ownership"], ["Who signs", "the seller (and sometimes the buyer) — signatures must be witnessed"], ["Witness", "an independent adult, not a family member or party to the deal"], ["After completion", "the buyer's solicitor sends the TR1 to HM Land Registry to register the new owner"]],
      tip: "Some deeds can now be signed electronically, but many are still signed on paper with a witness." },
    { t: "mcq", kicker: "Check", q: "Who can act as a witness when signing the TR1?", o: ["An independent adult who is not part of the deal", "The buyer's husband or wife", "The seller's 15-year-old son", "The estate agent who will earn a fee"], a: 0, why: "Witnesses should be independent adults with no interest in the transaction." },
    { t: "teach", kicker: "Week 9", emoji: "💷", title: "Stamp Duty: paying and filing", html: "<p>Your solicitor usually files the <b>SDLT return</b> and pays the tax for you — but you are legally responsible.</p>",
      formula: "Deadline: return filed and tax paid within <b>14 days of completion</b> — even if the tax is £0.<br>Sarah (first-time buyer, £184,500) → <b>£0</b> · James (home-mover, £400,000) → <b>£10,000</b>",
      reveal: [["Calculate: a home-mover buys for £280,000. SDLT?", "2% × £125,000 = £2,500 + 5% × £30,000 = £1,500 → £4,000"], ["A first-time buyer buys for £520,000. SDLT?", "No first-time buyer relief over £500,000 → standard rates: £2,500 + 5% × £270,000 (£13,500) = £16,000"]] },
    { t: "gap", kicker: "Check", q: "A home-mover buys a house for £300,000 in England. How much SDLT? (write £…)", acc: ["£5,000", "£5000", "5000", "5,000"], why: "2% of £125,000 = £2,500, plus 5% of £50,000 (£250,001–£300,000) = £2,500 → £5,000.", hint: "Slices: £0–125k at 0%, £125k–250k at 2%, the part above £250k at 5%." },
    { t: "research", kicker: "Week 9 · Research", emoji: "🧾", title: "Check the official rules", task: "Use GOV.UK to check <b>two facts</b> about Stamp Duty: (1) the deadline for the return, and (2) whether you must file a return when no tax is due. Then explain in 3–4 sentences why a buyer should still check that their solicitor has filed it.",
      queries: ["Stamp duty in the United Kingdom", "HM Revenue and Customs"],
      sources: [["GOV.UK — Stamp Duty Land Tax", "https://www.gov.uk/stamp-duty-land-tax", "Official overview, including how and when to pay"], ["GOV.UK — residential rates", "https://www.gov.uk/stamp-duty-land-tax/residential-property-rates", "Current bands"]],
      auto: [{ has: /14/, msg: "States the 14-day deadline" }], minWords: 45 },
    { t: "story", kicker: "Week 10", emoji: "⏰", title: "James finally finds a new buyer", html: "<p>With one day left, James accepts <b>£239,950</b> from Malik, a first-time buyer with a mortgage already approved and <b>no chain</b>. The Bennetts agree to wait — they have decided to rent for six months, which <b>breaks the chain</b> above them. James's solicitor works quickly and all three sales <b>exchange on the same day</b> in week 13.</p>",
      reveal: [["How did the Bennetts ‘break the chain’?", "By moving into rented accommodation, they no longer needed to buy at the same time as selling — so nobody above them can delay James."]] },
    { t: "teach", kicker: "Week 11", emoji: "🎯", title: "Completion day — Sarah's timeline", vocab: [["9:00", "Sarah's solicitor receives the mortgage money from the lender"], ["10:30", "the full price is sent to the seller's solicitor by CHAPS"], ["12:15", "the seller's solicitor confirms the money has arrived"], ["12:20", "the estate agent is told to release the keys"], ["1:00", "the seller has moved out (the contract says by 1 p.m.)"], ["1:30", "Sarah collects the keys — she's a homeowner! 🎉"]],
      tip: "Delays happen when banks are slow or when chains are long — so never book removal vans for very early in the morning on completion day." },
    { t: "speak", kicker: "Week 11 · Speak", title: "Explain completion day", task: "Record yourself explaining Sarah's completion day to a friend in <b>60 seconds</b>, using <b>sequencing words</b> (first, then, after that, finally) and at least two times.", limit: 60,
      model: "So, completion day starts early. First, at nine o'clock, the lender sends the mortgage money to Sarah's solicitor. Then her solicitor transfers the full price to the seller's solicitor. After that, as soon as the money arrives, the estate agent is told to release the keys. Finally, at about half past one, Sarah picks up the keys and walks into her new flat!",
      checklist: ["Sequencing words", "At least two times", "The money → keys order", "About 60 seconds"] },
    { t: "teach", kicker: "Week 11–12", emoji: "📦", title: "Post-completion tasks", vocab: [["Solicitor", "pays SDLT, files the return, registers the new owner with HM Land Registry, pays off the seller's mortgage"], ["Utilities", "take meter readings on day one; contact gas, electricity and water suppliers"], ["Council tax", "tell the local council you have moved in"], ["Change of address", "bank, employer, doctor (GP), driving licence (DVLA), electoral register"], ["Insurance", "buildings insurance (already from exchange) + contents insurance"]] },
    { t: "write", kicker: "Week 12 · Write", emoji: "✅", title: "Sarah's moving-in checklist", task: "Write Sarah's checklist for her first week as a homeowner: <b>at least 8 numbered tasks</b>, each starting with a verb (e.g. “1. Take meter readings…”). Include who she must contact.",
      auto: [{ lines: 8 }], minWords: 50,
      model: "1. Take photos of the gas, electricity and water meters.<br>2. Contact the energy supplier with the readings.<br>3. Tell Leeds City Council about council tax.<br>4. Arrange contents insurance.<br>5. Update my address with my bank and employer.<br>6. Register with a local GP.<br>7. Update my driving licence with the DVLA.<br>8. Register to vote at my new address.<br>9. Change the locks for security.<br>10. Check that my solicitor has registered me with HM Land Registry." },
    { t: "write", kicker: "Final reflection", emoji: "🏆", title: "Series summary & reflections", task: "Write a summary of the whole home-buying process (180–260 words), from first idea to keys, using what you learned about Sarah and James. Include at least <b>5 key terms</b>, <b>3 sequencing words</b>, and end with <b>one piece of advice</b> for a first-time buyer.",
      auto: [{ has: /(first|firstly)[\s\S]*(then|next|after that)[\s\S]*(finally|lastly|in the end)/i, msg: "3 sequencing words in order (first… then… finally)" }, { has: /(exchange)/i, msg: "Mentions exchange" }, { has: /(completion|complete)/i, msg: "Mentions completion" }, { has: /(survey|search)/i, msg: "Mentions surveys or searches" }, { has: /(should|advice|recommend)/i, msg: "Ends with advice" }], minWords: 180, maxWords: 280,
      starters: ["Buying a home in England starts with…", "First,…", "Then,…", "After that,…", "The most stressful part is…", "Finally,…", "My advice to a first-time buyer is…"] },
    { t: "summary", title: "🎓 Course complete — you bought a house (in English)!", html: "<p>Sarah got her keys in week 11. James and Priya moved into their four-bedroom home in week 14 — two weeks before the baby arrived. You have completed the hardest mission on I Learn English Here.</p>",
      points: ["explain exchange and completion precisely", "manage a crisis in diplomatic English", "calculate and explain Stamp Duty", "describe a completion-day timeline", "summarise a complex legal process"] }
  ]
};
