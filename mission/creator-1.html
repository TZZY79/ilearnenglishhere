<script>
window.MISSION = {
  id: "creator-1", file: "creator-1.html", mission: "creator", part: 1, min: 30, title: "Creator Academy: Series 1 🚀", level: "B2", next: "royal", nextUrl: "royal-1.html",
  desc: "Plan a real online channel in English: niche, hooks, platforms, SEO and a 90-day roadmap.",
  test: [
   {t:"mc",q:"What does “niche” mean for a content creator?",o:["A small, specialised topic or audience","A type of camera","A huge general market","A payment method"],a:0,why:"A niche is a focused area — e.g. “vegan cooking for students”, not just “food”."},
   {t:"mc",q:"On social media, “engagement” means…",o:["likes, comments, shares and saves","how many videos you upload","the price of an advert","how long a video is"],a:0,why:"Engagement = how people interact with your content."},
   {t:"mc",q:"Which is the strongest call to action?",o:["Subscribe now for a new tip every Monday!","Maybe watch more if you want.","Videos exist.","The end."],a:0,why:"A good call to action is direct, clear and tells people what they will get."},
   {t:"mc",q:"To “repurpose” content means…",o:["to delete old videos","to use the same content in new formats on other platforms","to copy someone else's video","to buy followers"],a:1,why:"One long video → shorts, a blog post, a carousel. Work smarter, not harder."},
   {t:"mc",q:"“Our channel ______ 1,000 subscribers since January.”",o:["has gained","gained","gains","is gaining"],a:0,why:"“Since January” connects the past to now → present perfect: has gained."},
   {t:"mc",q:"Which title is the most persuasive?",o:["Editing is a process.","3 editing tricks that will save you hours every week","Some information about editing","Editing video number 4"],a:1,why:"Numbers + a clear benefit (save hours) make people click."},
   {t:"gap",q:"SEO stands for Search Engine ______.",acc:["optimisation","optimization"],why:"SEO = Search Engine Optimisation (UK) / Optimization (US)."},
   {t:"mc",q:"Watch time is the total minutes people spend watching. If 10 people each watch 3 minutes, what is the watch time?",o:["30 minutes","10 minutes","3 minutes","13 minutes"],a:0,why:"10 × 3 = 30 minutes."},
   {t:"web",q:"🌐 Search online: In what year was YouTube founded?",acc:["2005"],hint:"Search: “YouTube founded year”.",why:"YouTube was founded in 2005."},
   {t:"write",q:"✍️ Write a hook: ONE sentence (8–20 words) that makes someone want to keep watching your video.",min:8,max:20,why:"A hook must be short and powerful — 8 to 20 words."}
  ],
  glossary: [
    ["niche", "a small, focused topic with a clear audience"], ["audience", "the people who watch or read your content"],
    ["hook", "the first few seconds that make people keep watching"], ["call to action (CTA)", "telling viewers what to do next (subscribe, comment, click)"],
    ["engagement", "likes, comments, shares and saves"], ["CTR (click-through rate)", "the % of people who see your thumbnail and click it"],
    ["watch time", "the total minutes people spend watching your videos"], ["average view duration", "how long people watch one video, on average"],
    ["repurpose", "turn one piece of content into new formats"], ["SEO", "search engine optimisation — helping people find you in search"],
    ["thumbnail", "the small picture people see before they click a video"], ["monetise", "earn money from something"],
    ["disclose", "tell people clearly (e.g. that a post is an advert)"], ["consistency", "doing something regularly, e.g. posting every week"]
  ],
  steps: [
    { t: "intro", emoji: "🚀", title: "Creator launch sequence", html: "<p>Millions of people learn, earn and build communities online. In this mission you will plan <b>your own channel or page</b> — in English — like a professional creator. You don't need to film anything today. You need to <b>think, research and write</b>.</p>",
      goals: ["choose a niche and describe your audience", "write a 7-second hook and a persuasive post", "compare platforms using real data", "use SEO to write titles and descriptions", "write a 90-day creator roadmap"] },
    { t: "teach", kicker: "Mission 1 · Launch", emoji: "🗺️", title: "Find your niche GPS", html: "<p>A niche is not “food” or “travel”. It is <b>who + what + why</b>.</p>",
      formula: "<b>I help</b> [who] <b>to</b> [do what] <b>by</b> [how]<br>e.g. I help <b>students in Asia</b> to <b>cook healthy meals</b> by <b>sharing 10-minute recipes</b>.",
      reveal: [["Too wide: “I make travel videos.” Make it a niche.", "I help backpackers on a budget to travel Southeast Asia by sharing $20-a-day city guides."], ["Too wide: “Fitness.” Make it a niche.", "I help busy parents to get fit at home by sharing 15-minute workouts with no equipment."]] },
    { t: "write", kicker: "Mission 1 · Action", title: "Define your niche GPS", task: "Write your niche sentence using the formula, then <b>2 more sentences</b> describing your audience (age, country, problem they have).", starters: ["I help", "to", "by", "My audience is…", "Their biggest problem is…"],
      auto: [{ has: /\bI help\b/i, msg: "Uses “I help…”" }, { has: /\bby\b/i, msg: "Explains how (“by…”)" }, { sentences: 3 }], minWords: 30,
      model: "I help English learners in Vietnam to sound natural by sharing one-minute videos about real British expressions. My audience is 18–30 years old and uses TikTok and YouTube every day. Their biggest problem is that textbook English sounds unnatural when they talk to foreigners." },
    { t: "teach", kicker: "Mission 1 · Instruction", emoji: "💣", title: "The 7-second value bomb", html: "<p>Most viewers decide in the first seconds whether to stay. Great videos follow a simple flow:</p>",
      formula: "<b>HOOK</b> (grab attention) → <b>VALUE</b> (teach, help, entertain) → <b>CTA</b> (what to do next)",
      vocab: [["Question hook", "", "Did you know you're saying ‘thank you’ wrong?"], ["Number hook", "", "3 mistakes that kill your English interview."], ["Promise hook", "", "In 60 seconds you'll order coffee like a Londoner."]] },
    { t: "mcq", kicker: "Mission 1 · Check", q: "What are the three parts of a strong content structure?", o: ["Hook → Value → Call to action", "Title → Music → Ending", "Intro → Advert → Goodbye", "Thumbnail → Hashtags → Likes"], a: 0, why: "Hook (attention) → Value (the reason to watch) → CTA (the next step)." },
    { t: "write", kicker: "Mission 1 · Action", title: "The persuasive post", task: "Write a short post (40–80 words) announcing your channel: start with a <b>hook</b>, give <b>value</b> (what people will get), end with a <b>call to action</b>.",
      auto: [{ has: /(subscribe|follow|join|comment|click|share|save|watch)/i, msg: "A call to action (subscribe / follow / comment…)" }], minWords: 40, maxWords: 90,
      model: "Still saying “I am fine, thank you”? 😅 Brits almost never say that! Every Monday I post a one-minute video with real phrases people use in the UK — with pronunciation tips and funny examples. Learn faster, sound natural and feel confident. 👉 Follow now and comment the phrase you want me to explain next!" },
    { t: "teach", kicker: "Mission 2 · Platforms", emoji: "📡", title: "Where is your audience?", html: "<p>Each platform has a different job:</p>",
      vocab: [["YouTube", "search + long videos + Shorts; best for evergreen learning content", "Key numbers: CTR and average view duration"], ["TikTok / Reels", "short, fast discovery; trends", "Key number: watch-through rate"], ["Instagram", "visual community, carousels, stories", "Key numbers: saves and shares"], ["Telegram / WhatsApp channels", "direct community and updates", "Key number: members and replies"], ["LinkedIn", "professional audience, careers and business", "Key numbers: comments and reposts"]],
      tip: "To earn money from YouTube ads you must join the YouTube Partner Program. The rules change — always check the official YouTube Help page." },
    { t: "research", kicker: "Mission 2 · Research", emoji: "💰", title: "Research: how do YouTubers get paid?", task: "Find the <b>current requirements</b> to join the YouTube Partner Program. Write <b>3–5 sentences</b>: how many subscribers are needed, how many watch hours OR Shorts views, and one other way creators earn money.",
      steps: ["Open the official YouTube Help page (trusted source below).", "Find the numbers: subscribers, watch hours, Shorts views.", "Notice there may be two levels (a lower level for fan funding, a higher one for ad money).", "Write the numbers in your own words."],
      queries: ["YouTube Partner Program", "YouTube monetization", "influencer marketing"],
      sources: [["YouTube Help — Partner Program overview", "https://support.google.com/youtube/answer/72851", "Official eligibility rules"], ["YouTube Creators", "https://www.youtube.com/creators/", "Official tips from YouTube"]],
      auto: [{ digit: true }], minWords: 40, starters: ["To join the YouTube Partner Program, you need…", "You also need either… or…", "Another way creators earn money is…"],
      model: "To earn money from ads, a channel needs 1,000 subscribers and either 4,000 public watch hours in the last 12 months or 10 million Shorts views in 90 days (in 2026). There is also a lower level with 500 subscribers that allows fan funding, such as channel memberships and Super Thanks. Another way creators earn money is through sponsorships and selling their own courses or products." },
    { t: "research", kicker: "Mission 2 · Research", emoji: "🌐", title: "Community hubs: Telegram vs WhatsApp", task: "Use the Research Lab to find <b>2 differences</b> between <b>Telegram channels</b> and <b>WhatsApp Channels</b> (e.g. size, privacy, features). Write a short comparison (50–90 words) using <b>whereas</b> or <b>while</b>.",
      queries: ["Telegram (software)", "WhatsApp", "WhatsApp Channels"],
      sources: [["Telegram — channels FAQ", "https://telegram.org/faq_channels", "Official features of Telegram channels"], ["WhatsApp — Channels", "https://faq.whatsapp.com/", "Official WhatsApp help centre (search: Channels)"]],
      auto: [{ has: /\b(whereas|while)\b/i, msg: "Uses whereas or while" }], minWords: 50,
      model: "Telegram channels can have an unlimited number of subscribers and allow long posts, files and polls, whereas WhatsApp Channels are built into an app that most people already use every day. Another difference is privacy: on WhatsApp Channels, followers cannot see each other's phone numbers, while Telegram lets people join with only a username. For a new creator, WhatsApp is easier for local followers, while Telegram is better for sharing many files." },
    { t: "teach", kicker: "Mission 3 · Toolkit", emoji: "🔄", title: "The repurpose machine", html: "<p>Professionals don't make 10 new things a week. They make <b>one</b> strong piece and <b>repurpose</b> it:</p>",
      formula: "1 long video → 3 Shorts/Reels → 1 blog post → 1 carousel → 1 newsletter → 5 quote posts",
      reveal: [["Why is repurposing smart?", "Less work, more reach: different people use different platforms, and repetition helps your message stick."]] },
    { t: "teach", kicker: "Mission 3 · SEO", emoji: "🔍", title: "SEO secrets: titles and descriptions", html: "<p>People find videos by searching. Put the words they type in your title and the first lines of your description.</p>",
      vocab: [["keyword", "the words people search for", "learn british slang"], ["title", "keyword first, clear benefit, under ~60 characters", "British Slang: 10 Words You'll Hear in London"], ["description", "first 2 lines matter most; add keywords naturally and links", ""], ["chapters", "timestamps that help viewers and search", "0:00 Intro · 0:45 Word 1"]],
      tip: "Type your topic into YouTube's search bar and look at the suggestions that appear — those are real searches." },
    { t: "write", kicker: "Mission 3 · Action", title: "Write an SEO title & description", task: "For your first video, write: a <b>title</b> (with your keyword), then a <b>description</b> of 50–100 words that uses the keyword in the first sentence and ends with a CTA.",
      starters: ["Title:", "Description:", "In this video, you'll learn…", "Subscribe for…"], auto: [{ has: /title\s*:/i, msg: "Starts with “Title:”" }, { has: /description\s*:/i, msg: "Has “Description:”" }], minWords: 55,
      model: "Title: British Slang for Beginners: 10 Words You'll Hear in London<br>Description: Learn British slang for beginners with 10 everyday words you will hear in London — from “cheers” to “knackered”. Each word comes with an example and pronunciation tip. Perfect for travel, work or watching UK TV. 👉 Subscribe for a new real-English video every Monday!" },
    { t: "teach", kicker: "Mission 3 · Rules", emoji: "⚖️", title: "Stay safe: adverts must be clear", html: "<p>If a brand pays you or gives you free products, you must say so clearly. In the UK the advertising rules (ASA/CAP) say labels like <b>#ad</b> or <b>Ad</b> must be obvious and at the start.</p>",
      vocab: [["#ad / Ad", "clear label for paid promotion"], ["gifted", "you received a free product"], ["affiliate link", "you earn a small commission if people buy"]],
      tip: "Breaking these rules can get your account penalised. Honesty also builds trust with your audience." },
    { t: "mcq", kicker: "Mission 3 · Check", q: "A shop gives you free headphones to review. What should you do?", o: ["Clearly label the post as an ad/gifted at the start", "Say nothing — it's only headphones", "Hide #ad at the end of 30 hashtags", "Delete the video after a week"], a: 0, why: "Paid or gifted content must be clearly and immediately labelled." },
    { t: "write", kicker: "Final task", emoji: "📅", title: "Your 90-day roadmap", task: "Write your <b>90-day plan</b> (90–180 words): Month 1 (setup & first videos), Month 2 (growth & repurposing), Month 3 (community & first income idea). Use <b>going to</b> for plans and <b>will</b> for predictions.",
      auto: [{ has: /going to/i, msg: "Uses “going to” for plans" }, { has: /\bwill\b/i, msg: "Uses “will” for a prediction" }, { has: /month 1|first month/i, msg: "Mentions Month 1" }], minWords: 90, maxWords: 200,
      starters: ["In Month 1, I'm going to…", "In Month 2, I'm going to…", "By Month 3, I think I will…", "My first income idea is…"],
      model: "In Month 1, I'm going to set up my YouTube channel and Instagram page and post one video every Monday. I'm going to research 20 keywords about British English. In Month 2, I'm going to repurpose each video into three Shorts and one carousel, and reply to every comment. By Month 3, I think I will have about 300 followers. I'm going to start a free Telegram group for practice and test my first income idea: a low-cost e-book of 100 British phrases. If it works, I will turn it into an online course." },
    { t: "summary", title: "Creator Academy Series 1 complete!", points: ["define a niche and audience", "write hooks, posts and CTAs", "compare platforms with real data", "write SEO titles and descriptions", "plan 90 days of growth"] }
  ]
};
</script>
