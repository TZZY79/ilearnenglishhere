    { t: "intro", emoji: "💖", title: "Love stories old and new", html: "<p>Over 400 years ago, William Shakespeare wrote <b>Romeo and Juliet</b>, the world's most famous love story. Today, K-dramas and K-pop fans around the world still love stories about <b>forbidden love</b>, <b>secrets</b> and <b>plot twists</b>. In this lesson you'll compare them — and write your own!</p>",

    { t: "mcq", q: "Romeo saw Juliet at a party and immediately ______ her.", o: ["fell in love with", "broke up with", "got engaged", "kept a secret"], a: 0, why: "fall in love with = start to love someone." },
    { t: "text", title: "The classic: Romeo and Juliet (simplified)", text: "In the Italian city of Verona, two rich families, the Montagues and the Capulets, hated each other. Their feud was very old. One night, Romeo Montague went secretly to a Capulet party. There he met Juliet Capulet, and they fell in love immediately. The next day they got married in secret. But then Romeo fought with Juliet's cousin, Tybalt, and killed him. Romeo had to leave the city. Juliet's parents, who knew nothing, planned her marriage to another man. A priest gave Juliet a potion to make her look dead for two days. Romeo didn't get the priest's message. He found Juliet, thought she was really dead, and took poison. When Juliet woke up, she saw Romeo and died too. Finally, the two families stopped fighting — but it was too late.",
      vocab: [["feud", "a long fight between families"], ["potion", "a magic or medical drink"], ["poison", "something that kills you if you drink or eat it"]] },
    { t: "gap", q: "Past simple: Romeo ______ (meet) Juliet at a party.", acc: ["met"], why: "meet → met (irregular)." },
    { t: "gap", q: "Past simple: The two families finally ______ (stop) fighting.", acc: ["stopped"], why: "stop → stopped (double the p)." },
    { t: "story", title: "The modern story: Mina and Jae", html: "<p><b>Mina</b> is the lead singer of <b>LUMI-7</b>, a (fictional) K-pop group. Her company has one rule: <b>no dating</b>. At a charity fan meeting in Bangkok, she meets <b>Jae</b>, a quiet photographer from a rival music company. They start messaging secretly. When a newspaper prints a blurry photo of them, both companies are furious and Mina's comeback is cancelled…</p>",

      model: "Both stories are about two young people whose love is forbidden. In Romeo and Juliet the problem is a family feud, whereas in the modern story it is a rule from a music company. Both couples meet at a party or event and keep their relationship secret. One big difference is the ending: Shakespeare's story is tragic, while Mina and Jae's story is not finished yet." },
    { t: "speak", title: "Role play: the secret message", task: "Record a short conversation (you can play both parts). Mina tells her best friend about Jae. Use <b>3 relationship phrases</b> and one question.", model: "Friend: You look happy! What's going on? Mina: Can you keep a secret? I think I have a crush on someone. Friend: Really? Who? Mina: His name is Jae. We met at the fan meeting and now we message every night. Friend: Are you going out? Mina: Not yet… but I think I'm falling in love.", checklist: ["3 relationship phrases", "At least one question", "Clear, friendly tone"] },
    { t: "research", title: "Shakespeare around the world", task: "Use the Research Lab to find <b>one film, musical or drama</b> based on Romeo and Juliet (from any country). Write 3–4 sentences: the title, country, year and how it changed the story.",
      queries: ["Romeo and Juliet", "West Side Story", "Romeo and Juliet in popular culture"], sources: [["Shakespeare Birthplace Trust", "https://www.shakespeare.org.uk/explore-shakespeare/shakespedia/shakespeares-plays/romeo-and-juliet/", "Summary and history of the play"], ["Royal Shakespeare Company", "https://www.rsc.org.uk/romeo-and-juliet", "The play on stage today"]],
      auto: [{ digit: true }], minWords: 40, starters: ["… is a film/musical from…", "It was made in…", "Instead of two families, the story…", "I would/wouldn't like to watch it because…"] },

      starters: ["A week later,…", "Suddenly,…", "To everyone's surprise,…", "In the end,…"] },
