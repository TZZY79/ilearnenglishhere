<div id="mk"><noscript><p style="padding:1rem">This interactive lesson needs JavaScript. Please open it in Chrome, Firefox or Safari.</p></noscript></div>
<script>
window.MISSION = {
  id: "precision-1", file: "precision-1.html", mission: "precision", part: 1, min: 20, title: "AAA: Apex Articulation Arena", level: "B1+", next: "britain", nextUrl: "britain-1.html",
  desc: "13 precision writing and speaking challenges with live checkers.",
  test: [
   {t:"mc",q:"How many words are in this sentence? “I finished my homework before breakfast this morning.”",o:["7","8","9","10"],a:1,why:"I · finished · my · homework · before · breakfast · this · morning = 8."},
   {t:"mc",q:"Which word is the ADVERB in: “She sang beautifully at the party.”?",o:["She","sang","beautifully","party"],a:2,why:"Adverbs describe HOW something is done — beautifully describes how she sang."},
   {t:"mc",q:"Which sentence has a word ending in -ed, a word ending in -ing AND a word ending in -st?",o:["I walked past the singing birds.","She is running fast.","We visited the first museum.","They played and laughed."],a:0,why:"walked (-ed) · singing (-ing) · past (-st)."},
   {t:"mc",q:"Which sentence uses ONLY the vowels A and O (no E, I or U)?",o:["Tom ate a hot dog.","A man can go so far.","Dogs bark at night.","A cat sat by the door."],a:1,why:"“ate” has E, “night” has I, “the” has E. “A man can go so far” only uses A and O."},
   {t:"mc",q:"Which word describes a SOUND?",o:["citrus","clanging","velvet","crimson"],a:1,why:"Clanging is a loud metal sound. Citrus = smell/taste, velvet = texture, crimson = colour."},
   {t:"mc",q:"Which sentence follows the order NOUN → VERB → ADVERB → PLACE?",o:["Quietly the dog outside slept.","The dog slept quietly outside.","The dog quietly outside slept.","Slept the dog quietly outside."],a:1,why:"dog (noun) → slept (verb) → quietly (adverb) → outside (place)."},
   {t:"gap",q:"Complete: “Yesterday I ______ (watch) a film with my friends.”",acc:["watched"],why:"Finished past action → past simple: watched."},
   {t:"gap",q:"Code challenge: remove every SECOND letter from the word TABLE. What is left?",acc:["tbe"],why:"T(keep) A(remove) B(keep) L(remove) E(keep) → TBE."},
   {t:"web",q:"🌐 Search online: In which English town was William Shakespeare born?",acc:["stratford-upon-avon","stratford upon avon","stratford"],hint:"Try searching: “Shakespeare birthplace town”.",why:"Shakespeare was born in Stratford-upon-Avon in 1564."},
   {t:"write",q:"✍️ Write ONE sentence of EXACTLY 7 words about where you are right now.",min:7,max:7,why:"Mission 1 is all about precision — every word counts, literally."}
  ],
  glossary: [
    ["precise", "exact and correct in every detail"], ["sensory detail", "something you can see, hear, smell, taste or touch"],
    ["adverb", "a word that tells you how, when or where something happens (quickly, today, outside)"],
    ["noun", "a person, place or thing (teacher, market, phone)"], ["verb", "an action or state word (run, think, is)"],
    ["vowel", "the letters a, e, i, o, u"], ["cipher", "a secret code"], ["plausible", "believable — it could be true"],
    ["fabrication", "something invented that is not true"], ["texture", "how something feels when you touch it (rough, smooth, soft)"],
    ["preposition", "a small word showing position or time (on, under, next to, before)"], ["articulation", "speaking clearly"],
    ["tongue twister", "a phrase that is difficult to say quickly"], ["relatable", "something you feel connected to because it is like your life"]
  ],
  steps: [
    { t: "intro", emoji: "🎯", title: "Welcome to the Arena", html: "<p>This mission tests one thing: <b>precision</b>. Every word counts — sometimes literally. You will write sentences with exact word counts, hidden word endings, banned letters and secret codes, then use your voice.</p><p>Each writing challenge has a <b>live checker</b>: the boxes turn ✅ green as you type, so you always know if you are right.</p>",
      goals: ["count words accurately and control sentence length", "use -ed, -ing and -st words naturally", "describe places with sensory detail", "speak clearly in short voice notes", "spot true and false information in a text"],
      how: "<ul><li>Teach first: read the short rule boxes.</li><li>Then write or speak. The checklist shows what is missing.</li><li>Stuck? Press <b>🆘 I'm stuck</b> at the top at any time.</li><li>At the end, copy your answer sheet and send it to your teacher or group.</li></ul>" },
    { t: "teach", title: "How to count words (the Arena rules)", formula: "1 word = letters with a <b>space</b> on each side. <b>don't</b> = 1 word · <b>ice-cream</b> = 1 word · <b>7:30</b> = 1 word",
      reveal: [["“I finished my homework before breakfast.” How many words?", "6 words: I · finished · my · homework · before · breakfast"], ["“It's raining in Ho Chi Minh City.” How many words?", "7 words — It's (1) raining (2) in (3) Ho (4) Chi (5) Minh (6) City (7)"]],
      tip: "Count with your finger on the screen, or just watch the word counter under each box — it counts for you." },
    { t: "teach", title: "Word endings: -ed, -ing, -st", html: "<p>Many missions ask for words with special endings:</p>",
      vocab: [["-ed", "past simple of regular verbs", "I walked to the market."], ["-ing", "continuous verbs or activities", "I am cooking. Swimming is fun."], ["-st", "superlatives and some other words", "the fastest, the first, last, past, most"]],
      reveal: [["Find the -st word: “This is the best soup I've ever tasted.”", "best (and tasted is an -ed word!)"]],
      tip: "-st words are everywhere: first, last, best, most, fast, past, just, must." },
    { t: "write", emoji: "📝", title: "Mission 1: The Precision Strike", task: "Write <b>two lines</b>:<ul><li>Line 1: <b>exactly 11 words</b> — something you did this morning.</li><li>Line 2: <b>exactly 7 words</b> — one sensory detail from where you are right now.</li></ul>Press Enter between the two lines.",
      auto: [{ lineWords: [11, 7] }], placeholder: "Line 1 (11 words)\nLine 2 (7 words)",
      model: "This morning I made strong coffee and answered three emails quickly.<br>I can hear motorbikes outside my window.",
      help: { hint: "Write your sentence first, then add or remove small words (really, very, my, this morning) until the counter matches." } },
    { t: "write", emoji: "🔑", title: "Mission 2: The Triple Threat Lockbox", task: "Write <b>ONE sentence</b> containing a word ending in <b>-ed</b>, a word ending in <b>-ing</b> and a word ending in <b>-st</b>.",
      auto: [{ sentences: 1, exact: true }, { endings: ["ed", "ing", "st"] }],
      model: "I walked past the singing street seller who had the best mangoes.",
      help: { hint: "Start with a past action (-ed), add someone doing something (-ing), finish with best/first/last (-st).", example: "We visited the busiest market while it was raining." } },
    { t: "write", emoji: "🗺️", title: "Mission 3: Location Recon", task: "Describe a place you visited in the last 7 days in <b>1–3 sentences</b>. Include: <b>1 smell</b>, <b>1 sound</b>, <b>1 colour</b>, <b>1 -ed verb</b> and <b>1 -ing verb</b>.",
      vocab: [["Smells", "smoky, sweet, fresh, spicy, citrus, salty"], ["Sounds", "chatter, honking, clanging, music, laughter, sizzling"], ["Colours", "bright orange, deep green, golden, faded blue"]],
      auto: [{ has: /\b(smell|smelled|smelt|smoky|sweet|spicy|fresh|citrus|salty|perfume|aroma)\w*/i, msg: "A smell word" }, { has: /\b(sound|hear|heard|noise|loud|quiet|chatter|honk|music|laugh|sizzl|clang|shout|sing)\w*/i, msg: "A sound word" }, { has: /\b(red|orange|yellow|green|blue|purple|pink|brown|black|white|grey|gray|golden|silver|colou?r)\w*/i, msg: "A colour" }, { endings: ["ed", "ing"] }, { sentences: 1 }],
      model: "On Saturday I visited the night market, where the air smelled of grilled corn and sweet coconut. People were laughing and bargaining under bright red lanterns." },
    { t: "teach", title: "Codebreaker rule: A and O only", formula: "Allowed vowels: <b>A, O</b> · Forbidden: <b>E, I, U</b>",
      vocab: [["Useful words", "a, an, and, at, as, of, on, go, got, to, so, no, not, for, from, of, top, cat, dog, car, bag, hot, cold, look, good, class, lots, work"]],
      tip: "“the”, “I”, “is”, “my” are forbidden! Start with “A” or a name: “Tom…”, “Mom…”, “Lots of…”" },
    { t: "write", emoji: "🔒", title: "Mission 4: Vowel Restriction Test", task: "Write <b>ONE sentence</b> about your day using <b>only the vowels A and O</b>. No E, I or U anywhere!",
      auto: [{ sentences: 1, exact: true }, { noLetters: "eiu" }, { has: /\w+\s+\w+\s+\w+/, msg: "At least 3 words" }], model: "Mom and Tom got a hot pot, and Rosa had a cold mango soda." },
    { t: "text", title: "Mission 5 text: The Lost Phone", html: "<p>Read this short story. You will use it in Missions 5 and 6.</p>",
      text: "Amara runs a small juice stall at a busy market in Accra, Ghana. Last Tuesday, a tourist ran to catch a bus and left his phone on her counter. Amara saw it ten minutes later. She didn't know the man's name, so she waited. At six o'clock the phone rang. It was the tourist's sister calling from Canada. Amara explained everything slowly and clearly in English. The next morning the man came back, red-faced and tired. He had searched three police stations. He tried to give Amara money, but she refused. Instead, he bought juice for everyone at the stall. Now he sends her a message every month, and her stall has a new sign in English: “Honest Juice — Since Tuesday.”",
      vocab: [["stall", "a small shop with an open front, often in a market"], ["counter", "the flat surface where you pay or are served"], ["refused", "said no to something"], ["red-faced", "embarrassed"]] },
    { t: "write", emoji: "📄", title: "Mission 5: Intel Processing", task: "Write <b>three answers</b> about the story (one per line):<ul><li><b>1. Relatability:</b> quote one sentence that reminds you of your life and say why.</li><li><b>2. Emotion:</b> name the main emotion of the story + one phrase from the text as evidence.</li><li><b>3. Swap:</b> if YOU were Amara, what would you do differently?</li></ul>",
      starters: ["1. The sentence that reminds me of my life is…", "because…", "2. The main emotion is…", "The phrase “…” shows this.", "3. If I were Amara, I would…"],
      auto: [{ lines: 3 }], minWords: 40, model: "1. “She didn't know the man's name, so she waited.” I once found a wallet and waited at a café for the owner.<br>2. Kindness — the phrase “she refused” shows she wanted no reward.<br>3. If I were Amara, I would also post a photo of the phone on the market's social media page." },
    { t: "write", emoji: "⚖️", title: "Mission 6: Fact or Fabrication", task: "Write a <b>numbered list of 5 statements</b> about the story: <b>3 true</b> and <b>2 false but believable</b>. Do NOT say which are false — test a friend!",
      auto: [{ lines: 5 }], starters: ["1. Amara sells…", "2. The tourist's sister called from…", "3. The man searched…", "4. ", "5. "],
      model: "1. Amara sells juice in Accra.<br>2. The tourist left his phone on a bus.<br>3. His sister called from Canada.<br>4. Amara accepted 50 dollars.<br>5. The stall has a new sign in English.<br><i>(False: 2 and 4)</i>" },
    { t: "write", emoji: "🧩", title: "Mission 7: The Five-Factor Sequence", task: "Write ONE sentence in this exact order, <b>one word per box</b>:<br>NOUN → VERB → ADVERB → PLACE → EMOTION-ADVERB<br><i>Example (don't copy): Children / laughed / loudly / outside / happily.</i>",
      auto: [{ words: 5 }, { sentences: 1, exact: true }], help: { hint: "Place words: outside, upstairs, home, downtown, abroad. Emotion adverbs: happily, sadly, nervously, proudly." }, model: "Grandmothers danced gracefully downstairs joyfully." },
    { t: "write", emoji: "🔠", title: "Mission 8: Your Own Encryption Key", task: "Write two lines:<br><b>Original:</b> a normal sentence<br><b>Cipher:</b> the same sentence keeping only letters 1, 3, 5, 7… (remove every second letter). Example: ABCDEF → ACE.",
      frame: "Original: \nCipher: ", auto: [{ cipher: true }], help: { hint: "Write the original without spaces first (e.g. Ilovetea), then keep every other letter: I-o-e-e-… → Ioee… The checker shows the correct cipher if you get stuck." } },
    { t: "speak", emoji: "🎤", title: "Mission 9: Voice Signal Warm-Up", task: "Record one voice note (about 20 seconds) with: your <b>name</b>, <b>where you are</b>, one sentence with an <b>-ed verb</b>, one sentence with an <b>-ing verb</b>.",
      model: "Hi, my name is Linh. I'm at home in Da Nang. Yesterday I cooked noodles for my family. Right now I'm drinking iced coffee.", checklist: ["Name", "Location", "-ED sentence", "-ING sentence"] },
    { t: "speak", emoji: "🔊", title: "Mission 10: Articulation Override", task: "Choose <b>any 3 tongue twisters</b> and record yourself. Say each one slowly first, then faster. <b>Clear beats fast.</b>",
      list: ["Red lorry, yellow lorry.", "She sells seashells by the seashore.", "Unique New York, unique New York.", "Peter Piper picked a peck of pickled peppers.", "Six slippery snails slid slowly seaward.", "Fresh fried fish, fish fresh fried.", "The thirty-three thieves thought that they thrilled the throne throughout Thursday."], checklist: ["3 different tongue twisters", "Each one said slowly, then faster"] },
    { t: "speak", emoji: "⚫", title: "Mission 11: The 20-Second Object", task: "Choose an object near you. Describe it for <b>20 seconds maximum</b> WITHOUT saying its name. Include: 1 colour, 1 texture, 1 -ed verb, 1 -ing verb, 1 preposition. Then ask a friend to guess!",
      limit: 20, model: "It's black and smooth. I charged it this morning. It's lying next to my keys and it's always buzzing with messages.", checklist: ["Colour", "Texture", "-ED verb", "-ING verb", "Preposition (on, next to, under…)", "Under 20 seconds"] },
    { t: "speak", emoji: "🎭", title: "Mission 12: Truth & Deception", task: "Record <b>4 statements</b> about your past week: <b>3 lies and 1 truth</b>. Use the same confident voice for all four. Send it to a friend — can they find the truth?",
      model: "On Monday I met a famous footballer. On Wednesday I ate twelve eggs. On Friday I lost my umbrella. On Sunday I swam in the sea at midnight.", checklist: ["4 statements", "Past simple verbs", "Same confident tone"] },
    { t: "write", emoji: "🏆", title: "Mission 13: Final Reflection", task: "Complete this sentence honestly in ONE sentence: <b>“This mission helped me…”</b>", frame: "This mission helped me ", auto: [{ sentences: 1, exact: true }], minWords: 8 },
    { t: "summary", title: "Arena cleared!", points: ["control sentence length precisely", "use -ed, -ing and -st words on purpose", "write sensory descriptions", "speak clearly under pressure"] }
  ]
};
</script>
