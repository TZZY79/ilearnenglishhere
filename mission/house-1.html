<script>
window.MISSION = {
  id: "house-1", file: "house-1.html", mission: "house", part: 1, min: 50, title: "Buying a Home in England · Series 1: Getting Started 🏠", level: "C1", next: "house-2", nextUrl: "house-2.html",
  desc: "The property market, the people involved, money maths and finding the right home — following Sarah and James.",
  test: [
   {t:"mc",q:"A “first-time buyer” is…",o:["someone buying their first home","someone selling a house","an estate agent","a landlord"],a:0,why:"First-time buyer = has never owned a home before."},
   {t:"mc",q:"When buying a house, the “deposit” is…",o:["the money you pay upfront as part of the price","your monthly rent","a bank's secret fee","a type of tax"],a:0,why:"The deposit is your own money; the mortgage pays the rest."},
   {t:"mc",q:"A “mortgage” is…",o:["a long-term loan to buy property, secured on the home","a house insurance policy","a type of house","a rental contract"],a:0,why:"If you don't pay, the lender can take the home — that's what “secured” means."},
   {t:"mc",q:"An “Agreement in Principle” (AIP) is…",o:["a lender's statement of how much they might lend you","the final house contract","a building survey","a moving-day checklist"],a:0,why:"An AIP shows sellers and agents you are a serious buyer."},
   {t:"mc",q:"A house costs £200,000. A 10% deposit is…",o:["£20,000","£2,000","£10,000","£200"],a:0,why:"10% of 200,000 = 20,000."},
   {t:"mc",q:"You borrow £180,000 for a £200,000 house. What is the loan-to-value (LTV)?",o:["90%","10%","80%","18%"],a:0,why:"180,000 ÷ 200,000 = 0.9 = 90% LTV."},
   {t:"gap",q:"The person who advertises the house and shows you around is the estate ______.",acc:["agent"],why:"Estate agent = the property seller's marketing person."},
   {t:"mc",q:"“Freehold” means…",o:["you own the building and the land with no time limit","you own it for a fixed number of years","you are renting","the council owns it"],a:0,why:"Freehold = full ownership. Leasehold = ownership for a fixed term (e.g. 99 years)."},
   {t:"web",q:"🌐 Search online: Which UK government body records who owns land and property in England and Wales? (HM ______ ______)",acc:["land registry","hm land registry"],hint:"Search: “who records property ownership England Wales”.",why:"HM Land Registry keeps the official record of ownership."},
   {t:"write",q:"✍️ Write at least 2 sentences (20+ words in total) explaining why a buyer should get an Agreement in Principle before viewing houses.",min:20,max:150,sentences:2,must:/(agreement|aip)/i,why:"Mention the Agreement in Principle (or AIP), use 2+ sentences and 20+ words."}
  ],
  glossary: [
    ["first-time buyer", "someone who has never owned a home before"], ["deposit", "your own money paid towards the price (often 5–20%)"],
    ["mortgage", "a long loan to buy a home; the lender can take the home if you don't pay"], ["lender", "the bank or building society that lends you money"],
    ["mortgage broker", "an adviser who compares mortgages for you"], ["Agreement in Principle (AIP)", "a lender's early statement of how much they might lend you"],
    ["LTV (loan-to-value)", "the mortgage as a % of the price: £180k loan ÷ £200k home = 90% LTV"], ["estate agent", "the company that markets the home for the seller"],
    ["vendor", "the seller (formal)"], ["conveyancer / solicitor", "the legal professional who transfers ownership"], ["surveyor", "an expert who inspects the condition of a property"],
    ["freehold", "you own the building and the land with no time limit"], ["leasehold", "you own the home for a fixed number of years (the lease)"],
    ["ground rent / service charge", "regular payments leaseholders make to the freeholder for land and building costs"], ["SDLT (Stamp Duty Land Tax)", "a tax paid when you buy property in England above certain prices"],
    ["chain", "linked sales where each buyer depends on another sale"], ["offer", "the price you say you will pay"], ["viewing", "a visit to look around a property"]
  ],
  steps: [
    { t: "intro", emoji: "🏠", title: "Welcome to your property buying journey", html: "<p>Buying a home in England is one of the biggest and most complicated things people do — and the language is full of special words. In this 3-part series you will follow two buyers from the first idea to the day they get the keys.</p><p>This is <b>Series 1: Getting Started</b> — the market, the people involved, the money and finding a home.</p>",
      goals: ["understand the English property market in 2026", "name everyone involved and what they do", "calculate deposit, LTV and Stamp Duty", "compare property types and freehold vs leasehold", "write a buyer's brief and make an offer by email"] },
    { t: "story", emoji: "👤", title: "Meet Sarah and James", html: "<p><b>Sarah, 29</b>, is a nurse in Leeds. She has saved <b>£19,000</b> and earns <b>£38,000</b> a year. She rents a small flat and is tired of paying her landlord. She is a <b>first-time buyer</b>.</p><p><b>James, 41</b>, is a teacher in Nottingham. He owns a two-bedroom terraced house with his partner, Priya. They have a baby on the way and need more space. James must <b>sell his house and buy a bigger one</b> at the same time — he is <b>moving up the ladder</b>.</p>",
      after: "<p>Sarah's problem is <b>money</b>. James's problem is <b>timing</b>. Keep both in mind — their stories continue in Series 2 and 3.</p>",
      reveal: [["Why is James's situation more complicated?", "He is in a chain: he must sell his home to buy the next one. If his buyer has problems, his purchase is delayed too."]] },
    { t: "teach", kicker: "Module 1 · The market", emoji: "📈", title: "The English property market (2026)", html: "<p>According to HM Land Registry's House Price Index (May 2026):</p>",
      vocab: [["UK average price", "about £271,000 (up 2.7% in a year)"], ["England average", "about £292,000"], ["First-time buyer average (England)", "about £244,000"], ["London", "much higher — often over £500,000"]],
      formula: "Typical timeline: <b>offer accepted → completion</b> often takes <b>3–5 months</b>. Extra costs on top of the deposit: often <b>3–5% of the price</b>.",
      tip: "Prices change every month. For research, always use the newest House Price Index on GOV.UK." },
    { t: "teach", kicker: "Module 1 · The people", emoji: "🧑‍🤝‍🧑", title: "Who does what?", vocab: [["Buyer", "Sarah / James — makes the offer and pays"], ["Seller (vendor)", "owns the home now"], ["Estate agent", "works for the SELLER: advertises, arranges viewings, passes on offers"], ["Mortgage broker", "finds the best mortgage for the buyer"], ["Lender", "the bank that lends the money"], ["Conveyancer / solicitor", "does the legal work for each side"], ["Surveyor", "checks the condition of the home"], ["HM Land Registry", "the government office that records who owns land"]],
      tip: "Remember: the estate agent is paid by the seller, so they want the highest price — be polite but careful what you tell them about your budget." },
    { t: "mcq", kicker: "Module 1 · Check", q: "Who does the estate agent work for?", o: ["The seller", "The buyer", "The bank", "HM Land Registry"], a: 0, why: "The seller pays the estate agent's fee, so the agent represents the seller." },
    { t: "teach", kicker: "Module 2 · Property types", emoji: "🏘️", title: "Property types and ownership", vocab: [["detached house", "stands alone, no shared walls"], ["semi-detached", "shares one wall with the house next door"], ["terraced house", "part of a row of joined houses"], ["flat / apartment", "one floor inside a bigger building"], ["bungalow", "a house with only one floor"], ["new build", "a newly built home, often with a builder's guarantee"]],
      formula: "<b>Freehold</b> = you own the building + land, forever (most houses)<br><b>Leasehold</b> = you own it for a set number of years; you may pay <b>ground rent</b> and a <b>service charge</b> (most flats)",
      reveal: [["Why do buyers check how many years are left on a lease?", "Short leases (often under 80 years) are expensive to extend and harder to get a mortgage for."]] },
    { t: "research", kicker: "Module 2 · Research", emoji: "🔎", title: "Property comparison task", task: "Sarah has a budget of about <b>£190,000</b> in <b>Leeds</b>. Use a property website to find <b>2 real homes</b> she could buy. Compare them in 5–7 sentences: type, bedrooms, price, freehold or leasehold, and one advantage of each. Finish with your recommendation.",
      steps: ["Open Rightmove or Zoopla. Search ‘Leeds’, max price £200,000, ‘For sale’.", "Choose two different homes (e.g. a flat and a terraced house).", "In each advert, look for: price, bedrooms, tenure (freehold/leasehold), service charge.", "Compare them using comparatives (bigger, cheaper, more modern than…)."],
      queries: ["Leeds", "Terraced house", "Leasehold estate"],
      sources: [["Rightmove", "https://www.rightmove.co.uk/", "The UK's biggest property website"], ["Zoopla", "https://www.zoopla.co.uk/", "Listings plus sold-price data"], ["HM Land Registry — UK House Price Index", "https://www.gov.uk/government/collections/uk-house-price-index-reports", "Official average prices"]],
      auto: [{ has: /£\s?\d/, msg: "Includes a price (£…)" }, { has: /(freehold|leasehold)/i, msg: "Mentions freehold or leasehold" }, { has: /(cheaper|bigger|larger|smaller|more|better|less)/i, msg: "Uses a comparative" }, { has: /recommend/i, msg: "Gives a recommendation" }], minWords: 70,
      starters: ["The first property is a…", "It costs…", "The second property is…", "It is cheaper/bigger than…", "I would recommend… because…"] },
    { t: "teach", kicker: "Module 3 · Money", emoji: "💰", title: "Deposits, mortgages and LTV", formula: "<b>Price − Deposit = Mortgage</b><br><b>LTV = Mortgage ÷ Price × 100</b><br>Sarah: £190,000 − £19,000 = <b>£171,000</b> mortgage → 171,000 ÷ 190,000 = <b>90% LTV</b>",
      vocab: [["affordability", "lenders often lend around 4–4.5 × your yearly income", "Sarah: £38,000 × 4.5 = £171,000"], ["interest rate", "the % you pay to borrow"], ["fixed rate", "the rate stays the same for 2, 5 or 10 years"], ["term", "how long the mortgage lasts — often 25–35 years"]],
      reveal: [["James's new house is £400,000. He has £100,000 from selling his old house. What is his LTV?", "Mortgage £300,000 ÷ £400,000 = 75% LTV — a lower LTV usually gets a better interest rate."]],
      tip: "A lower LTV (bigger deposit) usually means a lower interest rate." },
    { t: "gap", kicker: "Module 3 · Check", q: "A flat costs £200,000. The buyer has a £30,000 deposit. What is the LTV? (write the %)", acc: ["85%", "85", "85 %", "85 percent"], why: "£170,000 ÷ £200,000 = 0.85 = 85%.", hint: "Mortgage = 200,000 − 30,000 = 170,000. Then divide by 200,000." },
    { t: "teach", kicker: "Module 3 · Tax", emoji: "🧾", title: "Stamp Duty Land Tax (England, 2026)", html: "<p>SDLT is charged in <b>slices</b> — each rate only applies to the part of the price in that band.</p>",
      vocab: [["Standard buyer", "0% up to £125,000 · 2% £125,001–£250,000 · 5% £250,001–£925,000 · 10% £925,001–£1.5m · 12% above"], ["First-time buyer", "0% up to £300,000 · 5% £300,001–£500,000 · no relief if the price is over £500,000"], ["Second homes / buy-to-let", "an extra 5% on top of every band"]],
      formula: "James buys for <b>£400,000</b>: 0% on first £125,000 = £0 · 2% on next £125,000 = <b>£2,500</b> · 5% on last £150,000 = <b>£7,500</b> → total <b>£10,000</b><br>Sarah (first-time buyer) pays <b>£0</b> on £190,000.",
      tip: "Rates can change in the government's Budget. Always check the official GOV.UK calculator before buying." },
    { t: "research", kicker: "Module 3 · Research", emoji: "🧮", title: "Use the official calculator", task: "Use the official GOV.UK Stamp Duty calculator. Find the SDLT for a <b>£350,000</b> home in England for: <b>(a)</b> a first-time buyer and <b>(b)</b> a buyer who already owns a home and is moving (replacing their main home). Write both answers and explain the difference in 2–3 sentences.",
      steps: ["Open the GOV.UK SDLT calculator (trusted source below).", "Enter: England, freehold, residential, price £350,000.", "Answer the questions twice — once as a first-time buyer, once as a home-mover.", "Check your answers with the slice method from the last step."],
      queries: ["Stamp duty in the United Kingdom", "First-time buyer"],
      sources: [["GOV.UK — Stamp Duty calculator", "https://www.tax.service.gov.uk/calculate-stamp-duty-land-tax/", "The official calculator"], ["GOV.UK — Stamp Duty rates", "https://www.gov.uk/stamp-duty-land-tax/residential-property-rates", "Official current rates"]],
      auto: [{ has: /£\s?2,?500/, msg: "Answer (a) for the first-time buyer" }, { has: /£\s?7,?500/, msg: "Answer (b) for the home-mover" }], minWords: 35,
      help: { hint: "First-time buyer: 5% of the part above £300,000. Home-mover: 2% of £125,000 + 5% of the part above £250,000." },
      model: "(a) A first-time buyer would pay £2,500, because only the £50,000 above £300,000 is taxed at 5%. (b) A home-mover would pay £7,500: £2,500 on the slice from £125,000 to £250,000 and £5,000 on the slice from £250,000 to £350,000. First-time buyers get relief to help them get onto the property ladder." },
    { t: "teach", kicker: "Module 3 · Hidden costs", emoji: "🧰", title: "The costs people forget", vocab: [["Conveyancing / legal fees", "often around £1,500–£2,500"], ["Survey", "roughly £400–£1,500 depending on the level"], ["Mortgage fees", "£0–£1,500+ (arrangement or broker fees)"], ["Searches", "a few hundred pounds (part of legal costs)"], ["Moving costs", "van, removal company, new furniture"], ["Buildings insurance", "required from exchange of contracts"]],
      tip: "Common mistakes: not getting an AIP first, using a cheap unqualified conveyancer, forgetting insurance, underestimating costs." },
    { t: "video", kicker: "Watch", title: "How buying a home works in the UK", task: "Watch one short explainer video about the UK home-buying process. Write the <b>steps in order</b> (at least 6) using sequencing words.", search: "how to buy a house in the UK step by step first time buyer", minWords: 45, starters: ["First,…", "Next,…", "After that,…", "Then,…", "Finally,…"] },
    { t: "write", kicker: "Action", emoji: "✉️", title: "Make an offer by email", task: "Sarah has found a two-bedroom flat for <b>£195,000</b>. Write her email to the estate agent (90–150 words) offering <b>£186,000</b>. Mention: her AIP, that she is a first-time buyer with <b>no chain</b>, her deposit and that the offer is <b>subject to survey and contract</b>.",
      frame: "Dear Mr Patel,\n\nRe: 14 Elm Court, Leeds\n\n",
      auto: [{ has: /£\s?186,?000/, msg: "States the offer (£186,000)" }, { has: /(agreement in principle|\bAIP\b)/i, msg: "Mentions the AIP" }, { has: /chain/i, msg: "Mentions no chain" }, { has: /subject to/i, msg: "“subject to survey and contract”" }], minWords: 90, maxWords: 160,
      model: "Dear Mr Patel,<br><br>Re: 14 Elm Court, Leeds<br><br>Thank you for showing me the flat on Saturday. I would like to make an offer of £186,000, subject to survey and contract.<br><br>I am a first-time buyer with no chain, so I can move quickly. I have a mortgage Agreement in Principle from my lender for £171,000, and my deposit of £19,000 is ready in my savings account. I am happy to provide evidence of both.<br><br>I believe my offer is fair given that the kitchen needs updating. I look forward to hearing the seller's response.<br><br>Kind regards,<br>Sarah Collins" },
    { t: "summary", title: "Series 1 complete — the journey has begun!", html: "<p>Sarah's offer of £188,000 was accepted after a short negotiation, and James accepted an offer on his house. In <b>Series 2</b>, the legal work begins — and things start to go wrong…</p>", points: ["describe the English property market", "explain who does what", "calculate LTV and Stamp Duty", "compare homes and tenures", "make a professional offer"] }
  ]
};
</script>
