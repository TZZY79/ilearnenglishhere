<script>
window.MISSION = {
  id: "house-2", file: "house-2.html", mission: "house", part: 2, min: 50, title: "Buying a Home in England · Series 2: Legal Work Begins ⚖️", level: "C1+", next: "house-3", nextUrl: "house-3.html",
  desc: "Weeks 3–6: solicitors, surveys, searches, renegotiation, property forms and a chain under pressure.",
  test: [
   {t:"mc",q:"What does a conveyancer or property solicitor do?",o:["handles the legal transfer of the property","decorates the house","sells mortgages on TV","inspects the roof"],a:0,why:"Conveyancing = the legal work of moving ownership from seller to buyer."},
   {t:"mc",q:"A property “survey” is…",o:["an inspection of the property's condition","a questionnaire about your opinions","a map of the street","a tax form"],a:0,why:"A surveyor checks for problems like damp, cracks or roof damage."},
   {t:"mc",q:"Property “searches” are…",o:["official checks on things like planning, roads, drainage and flood risk","looking at houses online","the buyer's internet history","police checks"],a:0,why:"Searches reveal problems you can't see by visiting the house."},
   {t:"mc",q:"To “renegotiate” the price means…",o:["to discuss it again and agree a new price","to refuse to talk","to pay the full price immediately","to cancel the sale"],a:0,why:"Re + negotiate = negotiate again, e.g. after a bad survey."},
   {t:"mc",q:"A “property chain” is…",o:["a series of linked sales where each buyer depends on another sale","a group of estate agent offices","a lock for the front door","a street of identical houses"],a:0,why:"If one sale in the chain fails, everyone can be delayed."},
   {t:"mc",q:"Use the internet if you need to: in England, the TA6 form is the…",o:["Property Information Form, filled in by the seller","buyer's passport form","mortgage application","moving-van booking"],a:0,why:"The TA6 tells the buyer about boundaries, disputes, alterations and more."},
   {t:"gap",q:"Formal email: “Please find ______ the signed documents.”",acc:["attached","enclosed"],why:"“Please find attached…” (email) or “enclosed” (letter)."},
   {t:"mc",q:"“If the survey had found damp, we ______ the price.”",o:["would have renegotiated","will renegotiate","renegotiated","would renegotiate"],a:0,why:"Third conditional: If + had + past participle, would have + past participle."},
   {t:"web",q:"🌐 Search online: The TA10 form lists the “Fittings and ______” — what goes in the gap?",acc:["contents"],hint:"Search: “TA10 form fittings and”.",why:"TA10 = Fittings and Contents Form: what stays and what goes."},
   {t:"write",q:"✍️ Write ONE formal email sentence (15+ words) asking your solicitor for an update on the property searches.",min:15,max:80,must:/search/i,why:"Be formal, mention the searches, and write at least 15 words."}
  ],
  glossary: [
    ["instruct (a solicitor)", "officially ask a solicitor to work for you"], ["client care letter", "the solicitor's letter explaining their service and fees"],
    ["ID / anti-money-laundering checks", "checks that prove who you are and where your money comes from"], ["survey", "an inspection of the property's condition"],
    ["RICS Home Survey Level 1/2/3", "the three standard survey levels — Level 3 is the most detailed"], ["damp", "water getting into walls or floors"], ["subsidence", "the ground under a building sinking"],
    ["searches", "official checks: local authority (planning, roads), drainage and water, environmental (flooding)"], ["renegotiate", "discuss again and agree a new price"],
    ["TA6 Property Information Form", "the seller's answers about boundaries, disputes, alterations, guarantees…"], ["TA10 Fittings and Contents Form", "lists what is included in the sale (oven, curtains, shed…)"],
    ["mortgage offer", "the lender's formal, written offer to lend you the money"], ["contract pack", "the draft contract and forms sent by the seller's solicitor"],
    ["enquiries", "questions the buyer's solicitor asks the seller's solicitor"], ["gazump", "when a seller accepts a higher offer from someone else after agreeing to yours"],
    ["valuation", "the lender's check that the home is worth the price"]
  ],
  steps: [
    { t: "intro", emoji: "⚖️", title: "Series 2: the legal work begins", html: "<p>Offers accepted! Sarah agreed <b>£188,000</b> for her flat, and James accepted <b>£245,000</b> for his house and offered <b>£400,000</b> on a bigger one. Now the <b>legal work</b> begins — weeks 3 to 6. This is where most problems appear.</p>",
      goals: ["understand what solicitors, surveyors and searches do", "read and react to a survey report", "renegotiate politely and firmly", "understand the TA6, TA10 and contract pack", "write formal emails under pressure"] },
    { t: "story", kicker: "Week 3", emoji: "📞", title: "Sarah instructs her solicitor", html: "<p>Sarah calls three conveyancers for quotes and chooses one with good reviews. They send a <b>client care letter</b> and ask for <b>photo ID, proof of address and proof of her deposit</b> (bank statements). This is required by anti-money-laundering law.</p><p>Her solicitor writes to the seller's solicitor to say they are <b>instructed</b> and asks for the <b>contract pack</b>.</p>",
      vocab: [["quote", "the price for a service"], ["fixed fee", "a price that will not change"], ["proof of funds", "documents showing where your money is"]] },
    { t: "teach", kicker: "Week 3", emoji: "🏗️", title: "Understanding property surveys", html: "<p>The lender does a quick <b>valuation</b> — but that only protects the lender. Buyers pay for their own survey:</p>",
      vocab: [["Level 1", "basic condition report — for new, standard homes"], ["Level 2", "the most popular; checks for visible problems like damp or roof damage"], ["Level 3", "very detailed — for old, large or unusual buildings"]],
      formula: "Survey traffic lights: <b style='color:#7bd88f'>1 = OK</b> · <b style='color:#e0a548'>2 = repair needed, not urgent</b> · <b style='color:#ff8a80'>3 = serious / urgent</b>",
      tip: "Sarah's flat is in a 1930s building, so her surveyor recommends at least a Level 2 survey." },
    { t: "story", kicker: "Week 3", emoji: "🎉", title: "James finally gets a buyer", html: "<p>James's buyers are a young couple, Tom and Aisha. They are first-time buyers — perfect, because they have <b>no chain</b>. James's chain now looks like this:</p><p><b>Tom & Aisha → buy James's house → James buys a 4-bed house → the sellers (the Bennetts) buy a bungalow</b></p>",
      reveal: [["How many sales depend on each other in James's chain?", "Three: if any one fails, all of them can be delayed or collapse."]] },
    { t: "teach", kicker: "Week 4", emoji: "🔍", title: "Understanding property searches", vocab: [["Local authority search", "planning permissions, new roads, building control"], ["Drainage and water search", "is the home connected to public water and sewers?"], ["Environmental search", "flood risk, contaminated land, subsidence"], ["Others (by area)", "e.g. mining searches in old coal-mining areas"]],
      tip: "Searches can take from a few days to several weeks, depending on the local council." },
    { t: "research", kicker: "Week 4 · Research", emoji: "🌊", title: "Check the flood risk yourself", task: "Use the official GOV.UK long-term flood risk service to check a <b>real postcode in England</b> (choose one in a city you like, e.g. a street near a river in York). Write 4–5 sentences: the postcode/area, the risk from rivers/sea and surface water, and what a buyer should do next.",
      steps: ["Open ‘Check your long term flood risk’ (trusted source).", "Enter a postcode (you can find one on any property advert or online map).", "Note the risk levels: very low, low, medium or high.", "Write your answer, using should for advice."],
      queries: ["Flooding in the United Kingdom", "Environment Agency", "York flood"],
      sources: [["GOV.UK — Check long term flood risk", "https://www.gov.uk/check-long-term-flood-risk", "Official service from the Environment Agency"], ["GOV.UK — Buying a home: searches", "https://www.gov.uk/buy-sell-your-home", "Official guide to buying and selling"]],
      auto: [{ has: /\b(very low|low|medium|high)\b/i, msg: "States a risk level" }, { has: /\bshould\b/i, msg: "Gives advice with “should”" }], minWords: 50 },
    { t: "story", kicker: "Week 4", emoji: "📊", title: "Sarah's survey — problems found!", html: "<p>Sarah's Level 2 survey arrives. Most items are green, but there are two red (3) items:</p><ul><li><b>Damp</b> in the bathroom wall, probably from a leaking pipe — estimated repair: <b>£1,800</b>.</li><li>The <b>electrics</b> are old and need a full check by an electrician — possible rewiring: <b>£4,000–£6,000</b>.</li></ul><p>Sarah is shocked. She has very little money left after the deposit.</p>",
      reveal: [["What are Sarah's three options?", "1) Go ahead at the same price. 2) Renegotiate the price. 3) Withdraw from the purchase (she would lose the survey and legal costs paid so far)."]] },
    { t: "teach", kicker: "Week 5", emoji: "💰", title: "How to renegotiate politely", formula: "<b>Fact</b> (the survey found…) → <b>Cost</b> (quotes say…) → <b>Request</b> (I'd like to propose…) → <b>Positive close</b> (I'm still very keen…)",
      vocab: [["In light of the survey findings,…", "formal way to start"], ["I would like to propose a revised offer of…", "the request"], ["I have attached a quote from…", "evidence"], ["I remain committed to the purchase.", "positive, keeps the deal alive"]],
      tip: "Get a written quote from a builder or electrician. Sellers accept evidence more easily than opinions." },
    { t: "write", kicker: "Week 5 · Write", emoji: "📧", title: "Sarah renegotiates the price", task: "Write Sarah's email to the estate agent (100–160 words) proposing a <b>revised offer of £182,000</b> (instead of £188,000). Use the 4-part structure and mention the damp and the electrics.",
      frame: "Dear Mr Patel,\n\nRe: 14 Elm Court, Leeds — revised offer\n\n",
      auto: [{ has: /£\s?182,?000/, msg: "States £182,000" }, { has: /damp/i, msg: "Mentions the damp" }, { has: /electric/i, msg: "Mentions the electrics" }, { has: /(attached|quote)/i, msg: "Refers to evidence (quote / attached)" }], minWords: 100, maxWords: 170,
      model: "Dear Mr Patel,<br><br>Re: 14 Elm Court, Leeds — revised offer<br><br>In light of the survey findings, I am writing to propose a revised offer. The surveyor identified damp in the bathroom, caused by a leaking pipe, and recommended a full electrical inspection. I have attached two quotes: £1,800 for the damp repair and £4,500 for the rewiring.<br><br>I would therefore like to propose a revised offer of £182,000, which reflects around £6,000 of essential work. I remain committed to the purchase, and as a first-time buyer with no chain and a mortgage in progress, I can still proceed quickly.<br><br>I look forward to hearing the seller's response.<br><br>Kind regards,<br>Sarah Collins" },
    { t: "story", kicker: "Week 5", emoji: "🤝", title: "The answer", html: "<p>The seller doesn't accept £182,000, but agrees to <b>£184,500</b> and to fix the leaking pipe before completion. Sarah accepts. Her solicitor asks for the agreement <b>in writing</b>.</p>",
      reveal: [["Why ask for the agreement in writing?", "So the price change and the repair are recorded in the contract and cannot be forgotten or denied later."]] },
    { t: "teach", kicker: "Week 5–6", emoji: "📝", title: "The forms: TA6, TA10 and the contract pack", vocab: [["TA6 — Property Information Form", "the seller answers questions: boundaries, disputes with neighbours, building work, guarantees, flooding, parking"], ["TA10 — Fittings and Contents Form", "what stays and what goes: oven, carpets, curtains, light fittings, garden shed"], ["TA7 — Leasehold Information Form", "extra form for flats: service charge, ground rent, lease length"], ["Draft contract", "the agreement prepared by the seller's solicitor"], ["Enquiries", "questions from the buyer's solicitor about anything unclear"]],
      tip: "Sellers must answer the TA6 honestly. Lying (e.g. hiding a dispute with neighbours) can lead to legal action later." },
    { t: "mcq", kicker: "Check", q: "Sarah wants to know if the washing machine is included. Which form tells her?", o: ["TA10 Fittings and Contents Form", "TA6 Property Information Form", "Her mortgage offer", "The search results"], a: 0, why: "TA10 lists what is included or excluded from the sale." },
    { t: "story", kicker: "Week 5–6", emoji: "💼", title: "Mortgage approved — and James's chain gets complicated", html: "<p>Good news: the lender's valuation agrees with the price and Sarah receives her <b>mortgage offer</b>, valid for six months.</p><p>Bad news for James: the Bennetts (the sellers of his new house) <b>can't find a bungalow</b> they like. They say they might <b>pull out</b>. Meanwhile, Tom and Aisha's mortgage valuation says James's house is worth only <b>£240,000</b> — £5,000 less than they agreed.</p>",
      reveal: [["What is a ‘down-valuation’ and why is it a problem for James?", "The lender values the home below the agreed price, so the buyers may not be able to borrow enough. James may have to lower his price or the buyers must find the extra money."]] },
    { t: "write", kicker: "Week 6 · Write", emoji: "😤", title: "James chases his solicitor", task: "Write a formal but firm email from James to his solicitor (100–150 words). Ask for an <b>update on the searches and enquiries</b>, explain the <b>down-valuation</b> problem and ask for <b>advice on the risk</b> that the Bennetts pull out.",
      frame: "Dear Ms Okafor,\n\nRe: Sale of 22 Mill Lane and purchase of 5 Oak Drive\n\n",
      auto: [{ has: /search/i, msg: "Asks about the searches" }, { has: /valu/i, msg: "Mentions the (down-)valuation" }, { has: /advi[cs]e/i, msg: "Asks for advice" }, { has: /\?/, msg: "At least one question" }], minWords: 100, maxWords: 165 },
    { t: "research", kicker: "Week 6 · Research", emoji: "⚖️", title: "What do solicitors actually do?", task: "Research <b>conveyancing</b> in England. Write a list of <b>at least 6 jobs</b> a conveyancer does between the offer and completion, as numbered lines in the correct order.",
      queries: ["Conveyancing", "Solicitor", "HM Land Registry"],
      sources: [["Law Society — buying a home", "https://www.lawsociety.org.uk/public/for-public-visitors/common-legal-issues/buying-a-home", "Advice from solicitors' professional body"], ["MoneyHelper — conveyancing", "https://www.moneyhelper.org.uk/en/homes/buying-a-home", "Free, government-backed guidance"]],
      auto: [{ lines: 6 }], minWords: 50,
      model: "1. Checks the buyer's ID and source of funds.<br>2. Requests and reviews the contract pack (TA6, TA10, title documents).<br>3. Orders searches and reviews the results.<br>4. Raises enquiries with the seller's solicitor.<br>5. Checks the mortgage offer and reports to the buyer.<br>6. Arranges exchange of contracts and the deposit.<br>7. Transfers the money on completion and pays Stamp Duty.<br>8. Registers the new owner with HM Land Registry." },
    { t: "summary", title: "Series 2 complete — where are we now?", html: "<p>Sarah: survey done, price renegotiated to £184,500, mortgage offer received, searches back — <b>nearly ready to exchange</b>.<br>James: buyers' down-valuation and a chain at risk. Will it hold together? Find out in <b>Series 3: Exchange & Completion</b>.</p>",
      points: ["explain surveys, searches and the key forms", "react to a survey report", "renegotiate with evidence", "write firm, formal emails", "describe what conveyancers do"] }
  ]
};
</script>
