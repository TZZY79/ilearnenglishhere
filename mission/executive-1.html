<script>
window.MISSION = {
  id: "executive-1", file: "executive-1.html", mission: "executive", part: 1, min: 45, title: "Executive Ascent Protocol: Interview Hacking 💼", level: "C1", next: "house", nextUrl: "house-1.html",
  desc: "Decode job adverts, write a CV that proves your value, and answer interview questions like a professional.",
  test: [
   {t:"mc",q:"Which is the strongest CV bullet point?",o:["Increased monthly sales by 25% in six months by redesigning the email campaign.","Was responsible for sales.","Did emails.","I am hard-working."],a:0,why:"Action verb + number + how = proof of value."},
   {t:"mc",q:"Which sentence is in the ACTIVE voice?",o:["A team of eight was led by me.","I led a team of eight people.","The project was completed by our team.","Mistakes were made."],a:1,why:"Active: the subject does the action (I led). Employers prefer active voice."},
   {t:"mc",q:"A job ad says “proficient in Excel”. This means…",o:["highly skilled at Excel","a beginner at Excel","has never used Excel","dislikes Excel"],a:0,why:"Proficient = very skilled."},
   {t:"mc",q:"You know the manager's name is Priya Patel. Which salutation is correct?",o:["Dear Ms Patel,","Hey Patel!","Dear Patel Ms,","Yo Ms Patel,"],a:0,why:"Dear + title + surname + comma."},
   {t:"mc",q:"“In five years, I ______ to be leading my own department.”",o:["hope","will hope","must","am hope"],a:0,why:"I hope to + verb — a natural way to talk about future goals."},
   {t:"mc",q:"Interview question: “What is your greatest weakness?” Which is the best answer?",o:["I don't have any weaknesses.","I used to struggle with public speaking, so I joined a speaking club and now present every month.","I'm always late.","I work too hard, that's all."],a:1,why:"Honest weakness + what you did about it + result."},
   {t:"gap",q:"Replace “made better” with ONE strong action verb: “I ______ the ordering process.”",acc:["improved","streamlined","optimised","optimized","enhanced","upgraded","transformed","simplified","refined","revamped"],why:"Power verbs: improved, streamlined, optimised…"},
   {t:"mc",q:"In interviews, the STAR method stands for…",o:["Situation, Task, Action, Result","Start, Talk, Answer, Repeat","Skills, Training, Ambition, Respect","Smile, Thank, Ask, Reply"],a:0,why:"STAR = Situation, Task, Action, Result."},
   {t:"web",q:"🌐 Search online: “CV” is short for two Latin words. What are they?",acc:["curriculum vitae"],hint:"Search: “CV meaning Latin”.",why:"CV = curriculum vitae (“the course of life”)."},
   {t:"write",q:"✍️ Write ONE CV bullet point (10–25 words) that starts with an action verb ending in -ed and includes a number.",min:10,max:25,firstEd:true,digit:true,why:"Start with a verb like Increased / Reduced / Managed, and include a number (e.g. 20%, 3 months)."}
  ],
  glossary: [
    ["job advert (ad)", "a public notice describing a job and who can apply"], ["requirements", "skills or experience you MUST have"], ["desirable", "nice to have, but not essential"],
    ["CV (curriculum vitae)", "a document listing your experience, education and skills (US: résumé)"], ["cover letter", "a short letter that explains why you want the job"],
    ["action verb", "a strong verb that starts a CV point (led, increased, designed)"], ["quantify", "show something with numbers"], ["proficient", "highly skilled"],
    ["deadline", "the last date to apply"], ["salary", "money paid for a job, usually per year"], ["shortlist", "the small group of people chosen for interview"],
    ["STAR method", "Situation, Task, Action, Result — a way to answer interview questions"], ["transferable skills", "skills you can use in many jobs (communication, teamwork)"],
    ["reference", "a person who can confirm you are a good worker"]
  ],
  steps: [
    { t: "intro", emoji: "💼", title: "Protocol overview", html: "<p>Getting an international job in English is not about knowing difficult words. It's about <b>proving your value clearly</b>. In this mission you will decode a real job advert, upgrade your CV, write a professional email and prepare interview answers.</p>",
      goals: ["find the key requirements in a job advert", "write CV points with action verbs and numbers", "talk about future goals with modal verbs", "write a professional application email", "answer interview questions with the STAR method"] },
    { t: "text", kicker: "Task 2 · Deconstruct the job ad", title: "Read the job advert", html: "<p>Read this advert. Notice the difference between <b>essential</b> and <b>desirable</b>.</p>",
      text: "<b>Customer Success Coordinator — GreenLeaf Travel — a fictional company (Remote / Lisbon hub)</b><br>Salary: €28,000–€32,000 + bonus · Full-time · Apply by 30 November<br><br><b>About you — essential:</b> fluent written and spoken English; 1+ year in customer service; confident with CRM software (e.g. HubSpot or Salesforce); excellent problem-solving skills.<br><b>Desirable:</b> a second language (Spanish, Vietnamese or Swahili); experience in tourism; basic data reporting in Excel.<br><b>You will:</b> respond to customer enquiries within 24 hours; resolve complaints; train new team members; report weekly on customer satisfaction scores.<br>To apply, send your CV and a short cover letter to careers@greenleaf-travel.example",
      vocab: [["essential", "you must have it"], ["desirable", "an advantage, not required"], ["resolve", "solve a problem completely"], ["CRM", "customer relationship management software"]] },
    { t: "mcq", kicker: "Task 2 · Check", q: "Which of these is DESIRABLE (not essential) for the GreenLeaf job?", o: ["Experience in tourism", "Fluent English", "1+ year in customer service", "Confidence with CRM software"], a: 0, why: "Tourism experience is listed under Desirable — an advantage, not a must." },
    { t: "research", kicker: "Task 2 · Research", emoji: "🔍", title: "Decode a REAL job advert", task: "Find a <b>real job advert</b> you'd like (any country) on a job website. Write: the job title and company, <b>3 essential requirements</b>, <b>1 desirable</b> requirement, and <b>which requirement you match best</b> and why.",
      steps: ["Open a job site below and search a job you want (e.g. ‘English teacher’, ‘receptionist’, ‘marketing assistant’).", "Open one advert. Find the words requirements / essential / you will have.", "Copy the ideas into your notes, then rewrite them in your own words.", "Write your answer."],
      queries: ["Curriculum vitae", "Job interview", "Customer service"],
      sources: [["LinkedIn Jobs", "https://www.linkedin.com/jobs/", "International jobs, many in English"], ["Indeed", "https://www.indeed.com/", "Huge job search engine — choose your country"], ["UK Government — Find a job", "https://findajob.dwp.gov.uk/", "Official UK job site"]],
      minWords: 60, starters: ["The job is… at…", "The essential requirements are…", "A desirable requirement is…", "The requirement I match best is… because…"] },
    { t: "teach", kicker: "Task 3 · Action verb synthesis", emoji: "⚡", title: "Power verbs and active voice", html: "<p>CV points start with a strong verb in the past simple — no “I”, no “responsible for”.</p>",
      vocab: [["Weak", "was responsible for, helped with, did, worked on"], ["Leadership", "led, managed, coordinated, mentored, trained"], ["Results", "increased, reduced, improved, saved, achieved"], ["Creation", "designed, launched, built, developed, introduced"]],
      reveal: [["Upgrade: “I was responsible for social media.”", "Managed three social media accounts and grew followers by 40% in six months."], ["Upgrade: “Helped new staff.”", "Trained and mentored 12 new team members."]],
      formula: "Active: <b>I led a team of 8.</b> ✅  Passive: <i>A team of 8 was led by me.</i> ❌ (weaker)" },
    { t: "teach", kicker: "Task 5 · Quantifiable achievements", emoji: "📈", title: "Numbers prove value", formula: "<b>Action verb</b> + <b>what you did</b> + <b>number/result</b><br>Reduced customer waiting times by <b>30%</b> by introducing an online booking system.",
      reveal: [["No numbers? Use these: people, %, money, time, rankings.", "e.g. “Answered 60+ customer calls a day” · “Top 3 of 25 sales staff”"]], tip: "Even students have numbers: “Organised a charity event for 200 people that raised $1,500.”" },
    { t: "write", kicker: "Task 5 · Write", emoji: "📝", title: "Your achievement report", task: "Write <b>4 CV bullet points</b> about your own experience (work, study, volunteering or a hobby). Each must start with an <b>action verb</b> and at least 2 must include a <b>number</b>. One point per line, starting with “-”.",
      auto: [{ has: /^\s*-\s*\w+/m, msg: "Points start with “-”" }, { digit: true }, { has: /(led|managed|increased|reduced|improved|designed|launched|trained|organised|organized|created|developed|achieved|coordinated|built|saved|introduced)/i, msg: "Uses at least one power verb" }], minWords: 30,
      frame: "- \n- \n- \n- ", model: "- Organised a weekend English club for 25 university students.<br>- Increased café sales by 15% by creating a new Instagram page.<br>- Trained four new staff members to use the booking system.<br>- Translated 30 product descriptions from Vietnamese into English." },
    { t: "teach", kicker: "Task 4 · Future aspiration log", emoji: "🔭", title: "Talking about your future", vocab: [["I hope to…", "a wish", "I hope to lead a team within three years."], ["I'm aiming to…", "a clear goal", "I'm aiming to complete a CELTA certificate."], ["I'd like to…", "polite wish", "I'd like to develop my data skills."], ["I could see myself…", "imagining a future role", "I could see myself working in project management."], ["I might…", "a possibility", "I might specialise in digital marketing."]],
      reveal: [["Interview question: “Where do you see yourself in five years?” — a good structure?", "Goal + skills you'll develop + connection to THIS company: “I hope to be leading a small customer team, ideally here, after developing my coaching and data skills.”"]] },
    { t: "gap", kicker: "Task 4 · Check", q: "“In five years, I'm ______ to manage my own department.” (one word)", acc: ["aiming", "hoping", "planning"], why: "I'm aiming / hoping / planning to + verb." },
    { t: "teach", kicker: "Task 6 · Formal salutation protocol", emoji: "✉️", title: "Professional emails", vocab: [["Known name", "Dear Ms Nguyen, / Dear Mr Okafor,", "→ Kind regards, / Yours sincerely,"], ["Unknown name", "Dear Hiring Manager,", "→ Kind regards, / Yours faithfully,"], ["Opening line", "I am writing to apply for the position of…"], ["Attachment", "Please find attached my CV."], ["Closing line", "I look forward to hearing from you."]],
      tip: "Avoid “Dear Sir” (it excludes women), “Hey”, emojis and “Thanks in advance!!”." },
    { t: "write", kicker: "Task 6 · Write", emoji: "📧", title: "Application email", task: "Write an application email (120–180 words) for the GreenLeaf job OR the real job you found. Include: formal greeting, the position, <b>2 reasons you are a good match</b> (with evidence), the attachment line, a closing line and sign-off.",
      frame: "Dear Hiring Manager,\n\nI am writing to apply for the position of ",
      auto: [{ has: /^dear /im, msg: "Formal greeting" }, { has: /attached/i, msg: "Attachment line (Please find attached…)" }, { has: /(kind regards|yours sincerely|yours faithfully|best regards)/i, msg: "Professional sign-off" }], minWords: 120, maxWords: 200,
      model: "Dear Hiring Manager,<br><br>I am writing to apply for the position of Customer Success Coordinator advertised on LinkedIn. I have two years' experience at a busy hotel reception in Da Nang, where I resolved an average of 15 guest issues a day and kept our review score above 9.2. I am also confident with HubSpot, which I used to track bookings and follow up with customers.<br><br>In addition, I speak Vietnamese and English fluently, and I am currently learning Spanish, which would help me support GreenLeaf's growing markets. I am particularly attracted to your focus on sustainable travel.<br><br>Please find attached my CV. I would welcome the opportunity to discuss how I could contribute to your team.<br><br>I look forward to hearing from you.<br><br>Kind regards,<br>Thanh Pham" },
    { t: "teach", kicker: "Task 7 · Interview", emoji: "⭐", title: "The STAR method", formula: "<b>S</b>ituation (where/when) → <b>T</b>ask (your responsibility) → <b>A</b>ction (what YOU did — the biggest part) → <b>R</b>esult (number or outcome)",
      reveal: [["Question: “Tell me about a time you solved a problem.” — STAR example?", "S: At my hotel, our booking system crashed on a holiday weekend. T: I had to check in 40 guests. A: I created a paper list, called each guest and prioritised families with children. R: Everyone was checked in within an hour and we received two 5-star reviews mentioning our calm service."]] },
    { t: "speak", kicker: "Task 7 · Speak", title: "Interview simulation", task: "Answer this question out loud in <b>60–90 seconds</b> using STAR: <b>“Tell me about a time you worked under pressure.”</b>", limit: 90,
      model: "In my last job at a language centre, two teachers were ill on the same day before a big exam. My task was to keep three classes running. I reorganised the timetable, combined two groups for a revision game and asked a colleague to supervise the third. As a result, all sixty students took a practice test on time, and my manager asked me to write a plan for future emergencies.",
      checklist: ["Situation", "Task", "Action (most detail)", "Result with a number", "Under 90 seconds"] },
    { t: "video", kicker: "Task 7 · Watch", title: "Learn from real interviews", task: "Watch one video of a mock job interview in English. Write <b>2 good phrases</b> the candidate used and <b>1 mistake</b> you will avoid.", search: "mock job interview in English example answers", minWords: 30, starters: ["A good phrase was “…”", "Another useful phrase was “…”", "One mistake I will avoid is…"] },
    { t: "summary", title: "Protocol complete — you're interview-ready!", points: ["decode essential vs desirable requirements", "write powerful CV bullet points with numbers", "write a professional application email", "answer interview questions with STAR"] }
  ]
};
</script>
