<script>
window.MISSION = {
  id: "royal-1", file: "royal-1.html", mission: "royal", part: 1, min: 40, title: "The Royal Saga: Crown & Country 👑", level: "B2–C1", next: "executive", nextUrl: "executive-1.html",
  desc: "1,000 years of British monarchy — from conquest to constitutional monarchy and modern diplomacy.",
  test: [
   {t:"mc",q:"A “monarch” is…",o:["a king or queen","a type of castle","a member of Parliament","a soldier"],a:0,why:"Monarch = the king or queen of a country."},
   {t:"mc",q:"In a “constitutional monarchy”…",o:["the monarch is head of state, but Parliament makes the laws","the king makes all the laws","there is no king or queen","the army rules"],a:0,why:"The UK is a constitutional monarchy: the King reigns, Parliament governs."},
   {t:"mc",q:"Choose the correct form: “Magna Carta ______ in 1215.”",o:["was sealed","sealed","has sealed","is sealing"],a:0,why:"History often uses the passive: was sealed (by King John)."},
   {t:"mc",q:"Which sentence is the most formal?",o:["Get back to me quick.","We would be grateful if you could reply at your earliest convenience.","Reply soon, OK?","Text me back."],a:1,why:"“We would be grateful if…” and “at your earliest convenience” are formal phrases."},
   {t:"mc",q:"A monarch's “reign” is…",o:["the period of time they rule","rain from the sky","a royal horse","a crown"],a:0,why:"Reign (not rain!) = the time a king or queen rules."},
   {t:"mc",q:"“Queen Elizabeth II became queen in 1952 and reigned for 70 years.” Until when did she reign?",o:["2022","2012","2002","2032"],a:0,why:"1952 + 70 = 2022."},
   {t:"gap",q:"Complete: “By the time the king arrived, the guests had already ______ (leave).”",acc:["left"],why:"Past perfect = had + past participle: had left."},
   {t:"mc",q:"The Commonwealth is a “voluntary” association. Voluntary means…",o:["done by choice","forced","paid","secret"],a:0,why:"Voluntary = countries choose to be members."},
   {t:"web",q:"🌐 Search online: Who became King of the United Kingdom in September 2022?",acc:["charles iii","king charles iii","charles","king charles","charles the third"],hint:"Search: “King of the UK September 2022”.",why:"King Charles III became King on 8 September 2022."},
   {t:"write",q:"✍️ Write ONE formal sentence (at least 12 words) giving your opinion: do countries still need a monarchy? Use “although” or “however”.",min:12,max:80,must:/\b(although|however)\b/i,why:"You need at least 12 words and the linking word “although” or “however”."}
  ],
  glossary: [
    ["monarch", "a king or queen"], ["reign", "the period a monarch rules; also the verb (to reign)"], ["throne", "the special chair of a monarch; also means the position of king or queen"],
    ["conquest", "taking control of a country by force"], ["decree", "an official order"], ["Parliament", "the group of elected people (and the House of Lords) who make the UK's laws"],
    ["constitutional monarchy", "a system where the monarch is head of state but Parliament makes the laws"], ["Prime Minister", "the head of the UK government"],
    ["Commonwealth", "a voluntary group of 56 countries, most once part of the British Empire"], ["heir", "the person who will become the next monarch"],
    ["coronation", "the ceremony where a monarch is crowned"], ["diplomacy", "managing relationships between countries politely"], ["patron", "an important supporter of a charity"],
    ["abolish", "officially end something"]
  ],
  steps: [
    { t: "intro", emoji: "👑", title: "Welcome to the Royal Archives", html: "<p>The British monarchy is over a thousand years old — and it still makes headlines every week. In this mission you'll travel from <b>a king's sword in 1066</b> to <b>today's royal family</b>, learning the English used for history, power, politeness and debate.</p>",
      goals: ["use the passive and past tenses to talk about history", "explain how a constitutional monarchy works", "use very formal, polite English", "research a modern royal charity", "argue for and against the monarchy in a balanced way"] },
    { t: "teach", kicker: "Mission 1 · The King's Sword", emoji: "🛡️", title: "The start of the story: 1066", html: "<p>In <b>1066</b>, William, Duke of Normandy (France), defeated King Harold at the <b>Battle of Hastings</b>. He became <b>William the Conqueror</b>. Norman French became the language of the rulers — that's why English has two words for many things: <i>cow</i> (English farmers) and <i>beef</i> (French-speaking lords).</p>",
      formula: "History often uses the <b>passive</b>: <b>was/were + past participle</b><br>Harold <b>was defeated</b> at Hastings. The Tower of London <b>was built</b> by William.",
      reveal: [["Make it passive: “William built the White Tower.”", "The White Tower was built by William."], ["Make it passive: “King John sealed Magna Carta in 1215.”", "Magna Carta was sealed by King John in 1215."]] },
    { t: "research", kicker: "Mission 1 · Research", emoji: "🏰", title: "The royal land claim: the Domesday Book", task: "In 1086 William ordered a huge survey of England called the <b>Domesday Book</b>. Find out: <b>why</b> he made it and <b>what</b> it recorded. Write 3–4 sentences and use <b>at least one passive</b> (was/were + past participle).",
      queries: ["Domesday Book", "William the Conqueror", "Battle of Hastings"],
      sources: [["The National Archives — Domesday Book", "https://www.nationalarchives.gov.uk/domesday/", "Official home of the original book"], ["BBC Bitesize — Norman Conquest", "https://www.bbc.co.uk/bitesize", "Clear school-level explanations"]],
      auto: [{ has: /\b(was|were)\s+\w+(ed|en|t)\b/i, msg: "At least one passive (was/were + past participle)" }], minWords: 40,
      starters: ["The Domesday Book was made because…", "It recorded…", "It was completed in…", "Today it is kept at…"],
      model: "The Domesday Book was ordered by William the Conqueror in 1085 so that he knew who owned land and how much tax they should pay. Surveyors were sent across England to record land, people, animals and buildings. It was completed in 1086. Today it is kept at The National Archives in London." },
    { t: "write", kicker: "Mission 1 · Write", emoji: "📜", title: "The King's decree", task: "Imagine you are a medieval king or queen. Write a short, very formal <b>royal decree</b> (60–100 words) announcing a new law. Use <b>shall</b>, <b>hereby</b> and at least one passive.",
      frame: "By order of the Crown,\nWe hereby declare that ",
      auto: [{ has: /hereby/i, msg: "Uses “hereby”" }, { has: /\bshall\b/i, msg: "Uses “shall”" }], minWords: 60, maxWords: 120,
      model: "By order of the Crown,<br>We hereby declare that every market in the kingdom shall close on the first day of each month, so that merchants may rest. Any bread that is sold on that day shall be given to the poor. This decree was signed at Westminster on the tenth day of March and shall be read aloud in every town square." },
    { t: "teach", kicker: "Mission 2 · Power and the People", emoji: "⚖️", title: "The people say ‘Stop!’", html: "<p>Over centuries, power moved from the monarch to Parliament:</p>",
      vocab: [["1215 — Magna Carta", "barons force King John to accept limits on his power"], ["1649", "King Charles I is executed after the Civil War; England is briefly a republic"], ["1660", "the monarchy returns (the Restoration)"], ["1689 — Bill of Rights", "Parliament's rights are protected; the monarch cannot rule without it"], ["Today", "the King is head of state; the Prime Minister and Parliament govern"]],
      formula: "<b>The King reigns</b> (ceremonial role) — <b>Parliament governs</b> (makes laws)" },
    { t: "mcq", kicker: "Mission 2 · Check", q: "In the UK today, who makes the laws?", o: ["Parliament", "The King alone", "The army", "The Church"], a: 0, why: "The UK is a constitutional monarchy: the King gives Royal Assent, but Parliament makes the laws." },
    { t: "research", kicker: "Mission 2 · Research", emoji: "🤝", title: "The Prime Minister's power", task: "Find out what happens at the <b>weekly meeting (audience)</b> between the King and the Prime Minister, and what <b>Royal Assent</b> is. Write 4–5 sentences.",
      queries: ["Royal Assent", "Prime Minister of the United Kingdom", "Constitutional monarchy"],
      sources: [["The Royal Family (official website)", "https://www.royal.uk/", "Search: “The King and Government”"], ["UK Parliament — Royal Assent", "https://www.parliament.uk/site-information/glossary/royal-assent/", "Official Parliament glossary"]],
      minWords: 50, starters: ["Every week, the Prime Minister…", "Their conversations are…", "Royal Assent is…", "The last time a monarch refused…"],
      model: "Every week, the Prime Minister usually meets the King in a private meeting called an audience. Their conversations are completely confidential, and the King has the right to be consulted, to encourage and to warn. Royal Assent is the King's formal agreement that turns a bill into an Act of Parliament (a law). It is now a formality: the last time a monarch refused was in 1708, under Queen Anne." },
    { t: "teach", kicker: "Mission 2 · Debate language", emoji: "💪", title: "Debating power politely", vocab: [["Giving an opinion", "In my view… / I would argue that…"], ["Agreeing partly", "That's a fair point; however…"], ["Disagreeing politely", "I see what you mean, but I'm not sure that…"], ["Concluding", "On balance, I believe…"]],
      tip: "British debates use softeners: “I'm not entirely convinced…” sounds better than “You're wrong.”" },
    { t: "write", kicker: "Mission 2 · Debate", emoji: "🗣️", title: "Debating power", task: "Should the UK keep its monarchy? Write a balanced paragraph (90–160 words): <b>2 arguments for</b>, <b>2 arguments against</b>, and your conclusion with <b>On balance…</b>",
      auto: [{ has: /on balance/i, msg: "Concludes with “On balance…”" }, { has: /\b(however|although|whereas|on the other hand)\b/i, msg: "Uses a contrast linker (however / although / on the other hand)" }], minWords: 90, maxWords: 180,
      model: "Supporters argue that the monarchy is good for tourism and gives the country a symbol that is above party politics. They also say that royal visits strengthen friendships with other countries. On the other hand, critics believe it is unfair that a person becomes head of state by birth rather than by election. They also question the cost of royal palaces and security. On balance, I believe the monarchy will survive for now, because most people see it as part of British identity, although it may become smaller in the future." },
    { t: "teach", kicker: "Mission 3 · Global Diplomacy", emoji: "🌍", title: "The royal way of speaking", html: "<p>Queen Elizabeth II reigned from <b>1952 to 2022</b> — 70 years, the longest of any British monarch. Royal and diplomatic English is extremely polite and indirect.</p>",
      vocab: [["Your Majesty / Sir", "how to address the King (first ‘Your Majesty’, then ‘Sir’)"], ["I would be most grateful if…", "very formal request"], ["It would be an honour to…", "formal invitation/acceptance"], ["one", "formal ‘you/people’", "One must always be punctual."]],
      reveal: [["Make it diplomatic: “Come to our festival.”", "It would be an honour if you would attend our festival."], ["Make it diplomatic: “Your plan is bad.”", "With respect, I wonder whether there might be a better approach."]] },
    { t: "research", kicker: "Mission 3 · Research", emoji: "🌐", title: "The Commonwealth connection", task: "Research the <b>Commonwealth of Nations</b>. Write 4–5 sentences: how many countries are members, who the Head is, one member from Africa, one from Asia and one from the Caribbean or Pacific, and when the Commonwealth Games happen.",
      queries: ["Commonwealth of Nations", "Commonwealth Games", "Head of the Commonwealth"],
      sources: [["The Commonwealth (official)", "https://thecommonwealth.org/our-member-countries", "List of member countries"], ["Commonwealth Sport", "https://www.thecgf.com/", "The Commonwealth Games"]],
      auto: [{ digit: true }], minWords: 50,
      model: "The Commonwealth is a voluntary association of 56 countries, and King Charles III is its Head. Members include Nigeria and Kenya in Africa, India and Malaysia in Asia, and Jamaica and Fiji in the Caribbean and Pacific. Most members were once part of the British Empire, but some, like Rwanda and Mozambique, were not. The Commonwealth Games are held every four years." },
    { t: "write", kicker: "Mission 3 · Write", emoji: "🙏", title: "A formal request", task: "Write a very formal letter (80–130 words) inviting a member of the royal family to open a new school library in your town. Use at least 2 phrases from the royal way of speaking.",
      auto: [{ has: /(grateful|honour|honor|would be delighted|privilege)/i, msg: "Uses a formal phrase (grateful / honour / privilege)" }, { has: /yours (faithfully|sincerely)/i, msg: "Formal ending" }], minWords: 80, maxWords: 150,
      frame: "Dear Sir or Madam,\n\n", model: "Dear Sir or Madam,<br><br>I am writing on behalf of Riverside Community School to invite His Royal Highness the Prince of Wales to open our new library on 12 June. The library was built by parents and students over two years, and it will be used by more than 800 children. It would be a great honour if His Royal Highness were able to attend, and we would be most grateful for your consideration of this request.<br><br>Yours faithfully,<br>Anna Petrova, Head Teacher" },
    { t: "teach", kicker: "Mission 4 · The Modern Crown", emoji: "🏛️", title: "The Windsor family today", vocab: [["King Charles III", "became King on 8 September 2022; crowned on 6 May 2023"], ["Queen Camilla", "the King's wife"], ["William, Prince of Wales", "the King's elder son and heir"], ["Catherine, Princess of Wales", "William's wife"], ["Prince George", "William's eldest child — second in line to the throne"]],
      html: "<p>The modern royal family spends much of its time supporting charities. The King founded The Prince's Trust in 1976 — renamed <b>The King's Trust</b> in 2024 — which helps young people find work. Prince William started the <b>Earthshot Prize</b> for environmental solutions.</p>" },
    { t: "research", kicker: "Mission 4 · Research", emoji: "❤️", title: "Royal charities and causes", task: "Choose <b>one royal charity or project</b> (e.g. The King's Trust, The Earthshot Prize, Homewards, The Royal Foundation). Write 4–6 sentences: who started it, when, what it does, and one result or number.",
      queries: ["The King's Trust", "Earthshot Prize", "The Royal Foundation"],
      sources: [["The King's Trust", "https://www.kingstrust.org.uk/", "Official site"], ["The Earthshot Prize", "https://earthshotprize.org/", "Official site"], ["The Royal Family (official website)", "https://www.royal.uk/", "Search: charities and patronages"]],
      auto: [{ digit: true }], minWords: 50,
      starters: ["… was founded by … in …", "Its aim is to…", "For example,…", "So far, it has…"],
      model: "The Earthshot Prize was founded by Prince William in 2020. Its aim is to find and support the best solutions to the world's biggest environmental problems. Every year, five winners each receive £1 million to grow their projects. Categories include protecting nature, cleaning the air and fixing the climate. Past winners include a company in Kenya that makes cooking stoves which produce less smoke." },
    { t: "write", kicker: "Final task", emoji: "📊", title: "Final royal report", task: "Write a report (150–220 words) called <b>“1,000 Years of the Crown”</b>: 1) the Norman Conquest, 2) how Parliament gained power, 3) Elizabeth II and the Commonwealth, 4) the royal family today, 5) your opinion about its future. Use at least <b>2 passives</b> and <b>1 contrast linker</b>.",
      auto: [{ has: /\b(was|were)\s+\w+(ed|en|t)\b[\s\S]*\b(was|were)\s+\w+(ed|en|t)\b/i, msg: "At least 2 passives" }, { has: /\b(however|although|whereas|on the other hand|despite)\b/i, msg: "A contrast linker" }], minWords: 150, maxWords: 240,
      starters: ["In 1066, England was conquered by…", "Over the centuries,…", "Queen Elizabeth II…", "Today, King Charles III…", "In my opinion, the future of the monarchy…"] },
    { t: "summary", title: "The Royal Saga is complete!", points: ["use the passive for history", "explain the constitutional monarchy", "write in very formal, diplomatic English", "research royal charities and the Commonwealth", "debate both sides of a big question"] }
  ]
};
