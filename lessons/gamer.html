<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GEP9 Team Revision Battle</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a1a2e;
  --purple: #6c3fc5;
  --violet: #8b5cf6;
  --pink: #ec4899;
  --gold: #f59e0b;
  --green: #10b981;
  --red: #ef4444;
  --surface: #ffffff;
  --muted: #f1f0f7;
  --border: #e5e3f0;
  --text-muted: #7c7a92;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  font-family: 'Nunito', sans-serif;
  background: var(--ink);
  min-height: 100vh;
  color: var(--ink);
}

/* ─── BACKGROUND ─── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 20% 10%, rgba(108,63,197,.35) 0%, transparent 60%),
    radial-gradient(ellipse 50% 60% at 80% 90%, rgba(236,72,153,.25) 0%, transparent 60%),
    var(--ink);
  z-index: 0;
  pointer-events: none;
}

.app { position: relative; z-index:1; max-width:1300px; margin:0 auto; padding:20px; }

/* ─── HEADER ─── */
.header {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 16px;
  align-items: center;
  background: rgba(255,255,255,.07);
  backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 20px;
  padding: 20px 28px;
  margin-bottom: 20px;
}

.header-title h1 {
  font-size: 1.9em;
  font-weight: 900;
  color: #fff;
  letter-spacing: -0.5px;
}
.header-title p { color: rgba(255,255,255,.55); font-size:.9em; margin-top:2px; }

.pill-box {
  background: rgba(255,255,255,.1);
  border: 1px solid rgba(255,255,255,.15);
  border-radius: 14px;
  padding: 14px 22px;
  text-align: center;
  color: #fff;
  min-width: 130px;
}
.pill-label { font-size:.72em; opacity:.7; text-transform:uppercase; letter-spacing:1px; }
.pill-value {
  font-family: 'Space Mono', monospace;
  font-size: 2.1em;
  font-weight: 700;
  line-height: 1.1;
  margin-top: 4px;
}
.pill-value.score-val { color: var(--gold); }
.pill-value.timer-val { color: var(--violet); }
#timer.urgent { color: var(--red) !important; animation: pulse .6s infinite alternate; }
@keyframes pulse { from { opacity:1; } to { opacity:.4; } }

/* ─── CARD BASE ─── */
.card {
  background: var(--surface);
  border-radius: 18px;
  padding: 24px;
  margin-bottom: 18px;
  box-shadow: 0 4px 24px rgba(0,0,0,.12);
}

/* ─── TEAM SETUP ─── */
.setup-grid {
  display: grid;
  grid-template-columns: 1fr 1fr 80px auto;
  gap: 12px;
  align-items: end;
}
.setup-grid label { display:block; font-size:.8em; font-weight:700; color:var(--text-muted); margin-bottom:4px; text-transform:uppercase; letter-spacing:.5px; }
.setup-grid input {
  width:100%;
  padding: 12px 14px;
  border: 2px solid var(--border);
  border-radius: 10px;
  font-family: 'Nunito', sans-serif;
  font-size:.95em;
  transition: border .2s;
}
.setup-grid input:focus { outline:none; border-color: var(--violet); }
.btn-register {
  padding: 12px 22px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color:#fff;
  border:none;
  border-radius: 10px;
  font-family:'Nunito',sans-serif;
  font-weight:800;
  font-size:.95em;
  cursor:pointer;
  white-space:nowrap;
  transition: transform .15s, box-shadow .15s;
}
.btn-register:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(108,63,197,.35); }
.btn-register:disabled { opacity:.5; cursor:not-allowed; transform:none; }

.team-info {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:14px;
}
.team-chip {
  background: linear-gradient(135deg, var(--purple), var(--violet));
  color:#fff;
  padding:8px 18px;
  border-radius:30px;
  font-size:.88em;
  font-weight:700;
}

/* ─── PROGRESS ─── */
.progress-wrap { margin-bottom:18px; }
.progress-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.progress-row span { font-size:.85em; font-weight:700; color:rgba(255,255,255,.6); }
.progress-track {
  background: rgba(255,255,255,.1);
  border-radius:999px;
  height:14px;
  overflow:hidden;
}
.progress-fill {
  background: linear-gradient(90deg, var(--purple), var(--pink));
  height:100%;
  border-radius:999px;
  transition: width .5s cubic-bezier(.4,0,.2,1);
  display:flex; align-items:center; justify-content:flex-end; padding-right:8px;
}
.progress-fill span { font-size:.65em; color:#fff; font-weight:800; }

/* ─── ACTIVITY GRID ─── */
.activities-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 16px;
}

.act-card {
  background: var(--surface);
  border-radius: 16px;
  padding: 22px;
  cursor: pointer;
  border: 2px solid transparent;
  transition: all .25s;
  box-shadow: 0 4px 16px rgba(0,0,0,.1);
  position:relative;
  overflow:hidden;
}
.act-card::before {
  content:'';
  position:absolute;
  inset:0;
  background: linear-gradient(135deg, var(--purple) 0%, var(--pink) 100%);
  opacity:0;
  transition: opacity .25s;
  z-index:0;
}
.act-card:hover { transform:translateY(-5px); box-shadow:0 16px 40px rgba(108,63,197,.25); border-color: var(--violet); }
.act-card > * { position:relative; z-index:1; }

.act-card.locked { opacity:.5; cursor:not-allowed; }
.act-card.locked:hover { transform:none; box-shadow:none; }

.act-card.done { border-color: var(--green); }
.act-card.done .act-icon { filter:none; }
.done-badge {
  position:absolute;
  top:14px; right:14px;
  background: var(--green);
  color:#fff;
  font-size:.72em;
  font-weight:800;
  padding:3px 10px;
  border-radius:999px;
  z-index:2;
}

.act-icon { font-size:2.2em; margin-bottom:10px; display:block; }
.act-title { font-size:1.05em; font-weight:800; color:var(--ink); margin-bottom:6px; }
.act-desc { font-size:.82em; color:var(--text-muted); margin-bottom:14px; line-height:1.4; }
.act-meta {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding-top:12px;
  border-top:2px solid var(--muted);
}
.meta-tag {
  font-size:.78em;
  font-weight:800;
  padding:5px 10px;
  border-radius:8px;
}
.tag-time { background:#ede9fe; color:var(--purple); }
.tag-pts { background:#fce7f3; color:var(--pink); }
.btn-open {
  background: linear-gradient(135deg, var(--purple), var(--violet));
  color:#fff;
  border:none;
  padding:8px 18px;
  border-radius:8px;
  font-family:'Nunito',sans-serif;
  font-weight:800;
  font-size:.82em;
  cursor:pointer;
  transition:all .15s;
}
.btn-open:hover { transform:translateY(-1px); box-shadow:0 4px 12px rgba(108,63,197,.35); }

/* ─── MODAL ─── */
.overlay {
  display:none;
  position:fixed; inset:0;
  background: rgba(10,8,24,.8);
  backdrop-filter: blur(8px);
  z-index:500;
  align-items:flex-start;
  justify-content:center;
  padding:20px;
  overflow-y:auto;
}
.overlay.show { display:flex; }

.modal {
  background:#fff;
  border-radius:22px;
  width:100%;
  max-width:780px;
  margin:auto;
  box-shadow:0 40px 100px rgba(0,0,0,.4);
  overflow:hidden;
  animation: slideUp .3s cubic-bezier(.4,0,.2,1);
}
@keyframes slideUp { from { transform:translateY(40px); opacity:0; } to { transform:translateY(0); opacity:1; } }

.modal-head {
  background: linear-gradient(135deg, var(--purple), var(--pink));
  padding: 22px 28px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#fff;
}
.modal-head h2 { font-size:1.4em; font-weight:900; margin:0; }
.btn-close {
  background:rgba(255,255,255,.2);
  border:none;
  color:#fff;
  width:34px; height:34px;
  border-radius:50%;
  font-size:1.1em;
  cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition: background .15s;
}
.btn-close:hover { background:rgba(255,255,255,.35); }

.modal-body { padding:28px; }

/* ─── FORM ELEMENTS INSIDE MODAL ─── */
.instruction-box {
  background: linear-gradient(135deg,#ede9fe,#fce7f3);
  border-left: 4px solid var(--purple);
  padding: 14px 18px;
  border-radius: 10px;
  font-weight:700;
  font-size:.92em;
  margin-bottom:18px;
  color:var(--ink);
}

.team-tip {
  background: #f0fdf4;
  border: 2px dashed var(--green);
  padding:12px 16px;
  border-radius:10px;
  font-size:.85em;
  margin-bottom:18px;
  color:#065f46;
  font-weight:600;
}

.task-section {
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  margin-bottom:16px;
}
.task-section h4 {
  font-size:.9em;
  font-weight:800;
  color:var(--purple);
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:14px;
  padding-bottom:8px;
  border-bottom:2px solid var(--muted);
}

label.field-label {
  display:block;
  font-size:.82em;
  font-weight:700;
  color:var(--text-muted);
  margin-bottom:4px;
  margin-top:10px;
}

input.field, select.field, textarea.field {
  width:100%;
  padding:10px 13px;
  border:2px solid var(--border);
  border-radius:9px;
  font-family:'Nunito',sans-serif;
  font-size:.93em;
  transition:border .2s;
  background:#fff;
}
input.field:focus, select.field:focus, textarea.field:focus {
  outline:none;
  border-color:var(--violet);
}
input.field.error, select.field.error, textarea.field.error {
  border-color: var(--red) !important;
  background:#fff5f5;
}
textarea.field { min-height:90px; resize:vertical; }

.inline-row {
  display:grid;
  grid-template-columns:1fr 70px;
  gap:10px;
  align-items:center;
  margin-bottom:8px;
}
.inline-row span { font-size:.9em; font-weight:600; }
.inline-row input { margin:0; }

.vocab-table { width:100%; border-collapse:collapse; margin-top:8px; }
.vocab-table td { padding:6px 8px; border-bottom:1px solid var(--muted); font-size:.9em; }
.vocab-table td:last-child { width:80px; }
.vocab-table input { width:60px; padding:6px; text-align:center; }

.scoring-box {
  background: linear-gradient(135deg,#1a1a2e,#2d1b6e);
  color:#fff;
  padding:12px 16px;
  border-radius:10px;
  font-size:.82em;
  font-weight:700;
  margin-top:14px;
}
.scoring-box span { color:var(--gold); }

.validation-msg {
  background:#fef2f2;
  border:2px solid var(--red);
  color:var(--red);
  padding:10px 14px;
  border-radius:9px;
  font-size:.85em;
  font-weight:700;
  margin-top:12px;
  display:none;
}
.validation-msg.show { display:block; }

.btn-submit {
  width:100%;
  padding:16px;
  background: linear-gradient(135deg, var(--purple), var(--pink));
  color:#fff;
  border:none;
  border-radius:12px;
  font-family:'Nunito',sans-serif;
  font-size:1.05em;
  font-weight:900;
  cursor:pointer;
  margin-top:20px;
  letter-spacing:.3px;
  transition:all .2s;
  box-shadow:0 4px 20px rgba(108,63,197,.3);
}
.btn-submit:hover { transform:translateY(-2px); box-shadow:0 10px 28px rgba(108,63,197,.4); }

/* ─── ACTION BAR ─── */
.action-bar {
  display:flex;
  gap:12px;
  margin-bottom:20px;
  flex-wrap:wrap;
}
.btn-action {
  display:flex;
  align-items:center;
  gap:8px;
  padding:13px 22px;
  border:none;
  border-radius:12px;
  font-family:'Nunito',sans-serif;
  font-weight:800;
  font-size:.92em;
  cursor:pointer;
  transition:all .2s;
}
.btn-telegram {
  background: #2aabee;
  color:#fff;
  box-shadow:0 4px 14px rgba(42,171,238,.3);
}
.btn-telegram:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(42,171,238,.4); }
.btn-telegram:disabled { opacity:.4; cursor:not-allowed; transform:none; }
.btn-save {
  background: var(--surface);
  color:var(--ink);
  border:2px solid var(--border);
}
.btn-save:hover { border-color:var(--violet); transform:translateY(-2px); }
.btn-save:disabled { opacity:.4; cursor:not-allowed; transform:none; }

/* ─── CELEBRATION ─── */
.cel-overlay {
  display:none;
  position:fixed; inset:0;
  background:rgba(0,0,0,.5);
  z-index:900;
  align-items:center;
  justify-content:center;
}
.cel-overlay.show { display:flex; }
.cel-box {
  background:#fff;
  padding:50px 60px;
  border-radius:24px;
  text-align:center;
  box-shadow:0 40px 120px rgba(0,0,0,.4);
  animation:bounceIn .5s cubic-bezier(.4,0,.2,1);
}
@keyframes bounceIn { 0%{transform:scale(.5);opacity:0} 70%{transform:scale(1.05)} 100%{transform:scale(1);opacity:1} }
.cel-icon { font-size:4em; }
.cel-title { font-size:2em; font-weight:900; color:var(--purple); margin:12px 0 6px; }
.cel-sub { color:var(--text-muted); font-size:.95em; }
.cel-pts { font-size:2.5em; font-weight:900; color:var(--pink); margin-top:10px; }

.confetti-piece {
  position:fixed;
  font-size:1.6em;
  pointer-events:none;
  animation:fall 2.5s ease-in forwards;
}
@keyframes fall { 0%{opacity:1;transform:translateY(-20px) rotate(0deg)} 100%{opacity:0;transform:translateY(110vh) rotate(720deg)} }

/* ─── SECTION HEADER ─── */
.section-header {
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:16px;
}
.section-header h2 {
  color:#fff;
  font-size:1.2em;
  font-weight:800;
}
.section-header .badge {
  background:rgba(255,255,255,.12);
  color:rgba(255,255,255,.7);
  padding:4px 12px;
  border-radius:999px;
  font-size:.75em;
  font-weight:700;
}

/* ─── RESPONSIVE ─── */
@media(max-width:700px){
  .header { grid-template-columns:1fr 1fr; }
  .header-title { grid-column:1/-1; }
  .setup-grid { grid-template-columns:1fr; }
  .activities-grid { grid-template-columns:1fr; }
  .action-bar { flex-direction:column; }
  .btn-action { justify-content:center; }
}
</style>
</head>
<body>
<div class="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-title">
      <h1>🏆 GEP9 Revision Battle</h1>
      <p>Complete every field to earn points · Save & share to Telegram</p>
    </div>
    <div class="pill-box">
      <div class="pill-label">⏱ Time Left</div>
      <div class="pill-value timer-val" id="timer">90:00</div>
    </div>
    <div class="pill-box">
      <div class="pill-label">🎯 Score</div>
      <div class="pill-value score-val" id="scoreDisplay">0</div>
    </div>
  </div>

  <!-- TEAM SETUP -->
  <div class="card">
    <div class="setup-grid">
      <div>
        <label>Team Name</label>
        <input class="field" type="text" id="teamName" placeholder="e.g. Dragon Warriors">
      </div>
      <div>
        <label>Member Names (comma-separated)</label>
        <input class="field" type="text" id="memberNames" placeholder="e.g. Srey, Dara, Mony">
      </div>
      <div>
        <label>Count</label>
        <input class="field" type="number" id="memberCount" min="2" max="6" value="3">
      </div>
      <div>
        <label>&nbsp;</label>
        <button class="btn-register" id="registerBtn" onclick="registerTeam()">🚀 Register</button>
      </div>
    </div>
    <div class="team-info" id="teamInfo"></div>
  </div>

  <!-- PROGRESS -->
  <div class="progress-wrap">
    <div class="progress-row">
      <span>Challenge Progress</span>
      <span id="progressLabel">0 / 9 completed</span>
    </div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:0%"><span id="progressText"></span></div>
    </div>
  </div>

  <!-- ACTION BAR -->
  <div class="action-bar">
    <button class="btn-action btn-telegram" id="telegramBtn" disabled onclick="shareToTelegram()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.447 1.394c-.16.16-.295.295-.605.295l.213-3.053 5.56-5.023c.242-.213-.054-.333-.373-.12L8.117 14.28l-2.96-.924c-.643-.204-.657-.643.136-.953l11.57-4.461c.537-.194 1.006.131.831.279z"/></svg>
      Share to Telegram
    </button>
    <button class="btn-action btn-save" id="saveBtn" disabled onclick="saveAnswers()">
      💾 Save My Answers
    </button>
  </div>

  <!-- ACTIVITIES -->
  <div class="section-header">
    <h2>📋 Activities</h2>
    <span class="badge">Register your team to begin</span>
  </div>
  <div class="activities-grid" id="activitiesGrid"></div>

</div>

<!-- MODAL OVERLAY -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal">
    <div class="modal-head">
      <h2 id="modalTitle"></h2>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<!-- CELEBRATION -->
<div class="cel-overlay" id="celOverlay">
  <div class="cel-box">
    <div class="cel-icon" id="celIcon">🎉</div>
    <div class="cel-title" id="celTitle">Activity Complete!</div>
    <div class="cel-sub" id="celSub">Keep going!</div>
    <div class="cel-pts" id="celPts">+0 pts</div>
  </div>
</div>

<script>
// ─── STATE ────────────────────────────────────────────────────────
let team = null;
let score = 0;
let done = {};       // id → saved answer object
let timerSec = 90 * 60;
let timerInterval = null;

// ─── ACTIVITIES ────────────────────────────────────────────────────
const ACTS = [
  {
    id: 1, icon:'📚', title:'Vocabulary Race',
    desc:'Match academic vocabulary · write cooking definitions',
    time:15, pts:35,
    build: buildVocab
  },
  {
    id: 2, icon:'🎤', title:'Team Speaking Challenge',
    desc:'Discuss answers · one speaker presents to the class',
    time:10, pts:30,
    build: buildSpeaking
  },
  {
    id: 3, icon:'🔍', title:'Countable Detective',
    desc:'C or U? · fill in the correct quantifier',
    time:15, pts:40,
    build: buildCountable
  },
  {
    id: 4, icon:'🎯', title:'Future Plans Interview',
    desc:'Interview each other · write full sentence answers',
    time:10, pts:25,
    build: buildInterview
  },
  {
    id: 5, icon:'💊', title:'Advice Doctor',
    desc:'Role-play doctor · give two pieces of advice each',
    time:10, pts:30,
    build: buildAdvice
  },
  {
    id: 6, icon:'⚖️', title:'Have To / Don\'t Have To',
    desc:'Choose · debate the reason · swap roles',
    time:10, pts:25,
    build: buildObligation
  },
  {
    id: 7, icon:'⏰', title:'Time Expression Challenge',
    desc:'Fill in: since, for, ago, until, from...to',
    time:10, pts:35,
    build: buildTime
  },
  {
    id: 8, icon:'🎨', title:'-ED / -ING Adjectives',
    desc:'Act it out · choose the right form · explain the rule',
    time:5, pts:20,
    build: buildAdjective
  },
  {
    id: 9, icon:'❓', title:'Team Quiz Creator',
    desc:'Write 5 questions · exchange with another team',
    time:5, pts:40,
    build: buildQuiz
  }
];

// ─── TIMER ─────────────────────────────────────────────────────────
function startTimer() {
  const el = document.getElementById('timer');
  timerInterval = setInterval(() => {
    timerSec--;
    const m = Math.floor(timerSec / 60);
    const s = timerSec % 60;
    el.textContent = String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
    if (timerSec <= 300) el.classList.add('urgent');
    if (timerSec <= 0) {
      clearInterval(timerInterval);
      alert('⏰ Time is up! Final Score: ' + score + ' points\n\nDon\'t forget to save and share your answers!');
    }
  }, 1000);
}

// ─── REGISTER ──────────────────────────────────────────────────────
function registerTeam() {
  const name = document.getElementById('teamName').value.trim();
  const members = document.getElementById('memberNames').value.trim();
  const count = parseInt(document.getElementById('memberCount').value) || 3;
  if (!name) return flash('Enter a team name!');
  if (!members) return flash('Enter member names!');
  const list = members.split(',').map(m => m.trim()).filter(Boolean);
  if (list.length < 2) return flash('Add at least 2 member names, separated by commas.');

  team = { name, members: list, count };

  document.getElementById('teamInfo').innerHTML = `
    <div class="team-chip">🎮 ${name}</div>

// ─── RENDER GRID ───────────────────────────────────────────────────
function renderGrid() {
  const grid = document.getElementById('activitiesGrid');
  if (!team) { grid.innerHTML = '<p style="color:#fff;opacity:.5;grid-column:1/-1;text-align:center;padding:40px">Register your team first to see activities.</p>'; return; }

  grid.innerHTML = ACTS.map(a => {
    const isDone = !!done[a.id];
    return `
    <div class="act-card ${isDone ? 'done' : ''}">
      ${isDone ? '<div class="done-badge">✓ Done</div>' : ''}
      <span class="act-icon">${a.icon}</span>
      <div class="act-title">${a.title}</div>
      <div class="act-desc">${a.desc}</div>
      <div class="act-meta">
        <span class="meta-tag tag-time">⏱ ${a.time}m</span>
        <span class="meta-tag tag-pts">🏆 ${a.pts} pts</span>
        <button class="btn-open" onclick="openAct(${a.id})">${isDone ? '📝 Edit' : 'Open'}</button>
      </div>
    </div>`;
  }).join('');
}

// ─── OPEN / CLOSE MODAL ────────────────────────────────────────────
function openAct(id) {
  if (!team) return flash('Register your team first!');
  const act = ACTS.find(a => a.id === id);
  document.getElementById('modalTitle').textContent = act.icon + '  ' + act.title;
  document.getElementById('modalBody').innerHTML = act.build(id, done[id]);
  document.getElementById('overlay').classList.add('show');
}
function closeModal() { document.getElementById('overlay').classList.remove('show'); }
document.getElementById('overlay').addEventListener('click', e => { if (e.target === document.getElementById('overlay')) closeModal(); });

// ─── VALIDATION HELPER ─────────────────────────────────────────────
function getVal(id) { const el = document.getElementById(id); return el ? el.value.trim() : ''; }
function allFilled(ids) { return ids.every(id => { const el = document.getElementById(id); if(!el) return false; const v = el.value.trim(); if(!v){ el.classList.add('error'); } else { el.classList.remove('error'); } return !!v; }); }

function showValidationError(msg) {
  const box = document.getElementById('validationMsg');
  if (box) { box.textContent = '⚠️ ' + msg; box.classList.add('show'); }
}

// ─── SUBMIT ────────────────────────────────────────────────────────
function submitAct(id, collectFn) {
  const result = collectFn();
  if (!result) return; // validation failed inside collectFn
  done[id] = result;
  const act = ACTS.find(a => a.id === id);
  score += act.pts;
  document.getElementById('scoreDisplay').textContent = score;
  updateProgress();
  renderGrid();
  closeModal();
  celebrate(act.pts, act.title);
  checkEnableShare();
}

// ─── PROGRESS ──────────────────────────────────────────────────────
function updateProgress() {
  const n = Object.keys(done).length;
  const pct = (n / ACTS.length) * 100;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = n > 0 ? n + '/' + ACTS.length : '';
  document.getElementById('progressLabel').textContent = n + ' / ' + ACTS.length + ' completed';
}

function checkEnableShare() {
  const n = Object.keys(done).length;
  if (n >= 1) document.getElementById('telegramBtn').disabled = false;
}

// ─── CELEBRATE ─────────────────────────────────────────────────────
function celebrate(pts, title) {
  document.getElementById('celIcon').textContent = ['🎉','⭐','🏆','✨','🎊','🔥'][Math.floor(Math.random()*6)];
  document.getElementById('celTitle').textContent = 'Activity Complete!';
  document.getElementById('celSub').textContent = title;
  document.getElementById('celPts').textContent = '+' + pts + ' pts';
  document.getElementById('celOverlay').classList.add('show');
  for (let i = 0; i < 28; i++) spawnConfetti();
  setTimeout(() => document.getElementById('celOverlay').classList.remove('show'), 2200);
}

function spawnConfetti() {
  const el = document.createElement('div');
  el.className = 'confetti-piece';
  el.textContent = ['🎉','⭐','✨','💜','🌸','🔥','🎊'][Math.floor(Math.random()*7)];
  el.style.left = Math.random() * 100 + 'vw';
  el.style.top = '-40px';
  el.style.animationDelay = Math.random() * 1 + 's';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 3500);
}

// ─── SAVE ──────────────────────────────────────────────────────────
function saveAnswers() {
  if (!team) return flash('Register your team first!');
  const blob = new Blob([buildFullText()], {type:'text/plain'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (team.name.replace(/\s+/g,'_') || 'team') + '_GEP9_Answers.txt';
  a.click();
}

// ─── SHARE TO TELEGRAM ─────────────────────────────────────────────
function shareToTelegram() {
  if (!team) return flash('Register your team first!');
  const text = buildFullText();
  const encoded = encodeURIComponent(text);
  // Open Telegram share URL
  const url = 'https://t.me/share/url?url=GEP9+Answers&text=' + encoded;
  window.open(url, '_blank');
}

function buildFullText() {
  const line = '─────────────────────────────────────';
  let out = `🏆 GEP9 REVISION BATTLE — TEAM ANSWERS\n${line}\n`;
  out += `Team:    ${team.name}\n`;
  out += `Members: ${team.members.join(', ')}\n`;
  out += `Score:   ${score} pts\n`;
  out += `Date:    ${new Date().toLocaleString('en-GB')}\n${line}\n\n`;

  ACTS.forEach(act => {
    const ans = done[act.id];
    out += `${act.icon} ${act.title.toUpperCase()}  [${act.pts} pts]\n`;
    if (!ans) {
      out += '  (not submitted)\n';
    } else {
      Object.entries(ans).forEach(([k, v]) => {
        out += `  ${k}: ${v}\n`;
      });
    }
    out += '\n';
  });

  out += `${line}\n🎯 Total Score: ${score} / ${ACTS.reduce((s,a)=>s+a.pts,0)} pts\n`;
  return out;
}

  return `
    <div class="instruction-box">🎭 Act It Out! One person acts BORED, the other acts BORING. Then choose the right word and explain why.</div>
    <div class="team-tip">💬 -ED = how a person FEELS &nbsp;|&nbsp; -ING = what something IS LIKE. Act out the emotion, then decide.</div>

    <div class="task-section">
      <h4>Choose the correct form</h4>
      ${sentences.map((s,i) => `
        <div class="inline-row" style="grid-template-columns:1fr 160px;">
          <span>${i+1}. ${s.text}</span>
          <select class="field" id="adj_${i+1}">
            <option value="">Choose</option>
            ${s.opts.map(o=>`<option value="${o}" ${sv['adj_'+(i+1)]===o?'selected':''}>${o}</option>`).join('')}
          </select>
        </div>
      `).join('')}
    </div>

    <div class="task-section">
      <h4>Explain the rule in your own words</h4>
      <label class="field-label">What is the difference between -ED and -ING adjectives?</label>
      <textarea class="field" id="adj_rule" placeholder="-ED adjectives are used when...\n-ING adjectives are used when...\nExample: The class was boring. I was bored." style="min-height:90px">${sv['rule']||''}</textarea>
    </div>

    <div class="scoring-box">🏆 Scoring: Correct answers <span>12 pts</span> · Rule explanation <span>8 pts</span> = <span>20 pts total</span></div>
    ${validationBox()}
    <button class="btn-submit" onclick="submitAct(${id}, collectAdjective)">✓ Submit Activity 8</button>`;
}

function collectAdjective() {
  const ids = ['adj_1','adj_2','adj_3','adj_4','adj_5','adj_rule'];
  if (!allFilled(ids)) { showValidationError('Choose an answer for every sentence AND write the rule.'); return null; }
  const labels=['lecture','felt_won','movie','they_result','hike','rule'];
  const obj = {};
  ids.forEach((id,i) => obj[labels[i]] = getVal(id));
  return obj;
}

// 9. QUIZ
function buildQuiz(id, saved) {
  const sv = saved || {};
  return `
    <div class="instruction-box">🧠 Quiz Masters! Create 5 questions together, then exchange papers with another team. Grade their answers!</div>
    <div class="team-tip">💬 Harder questions = more impressive. Include the correct answer so you can check the other team's work.</div>

    <div class="task-section">
      <h4>📝 Your Team's Questions (include the correct answer for each)</h4>
      ${[
        {type:'Vocabulary',id:'qz_q1'},{type:'Vocabulary',id:'qz_q2'},
        {type:'Grammar',id:'qz_q3'},{type:'Grammar',id:'qz_q4'},
        {type:'Speaking / Discussion',id:'qz_q5'}
      ].map((q,i) => `
        <label class="field-label">Q${i+1} — ${q.type}</label>
        <textarea class="field" id="${q.id}" placeholder="Question: ...\nAnswer: ..." style="min-height:65px">${sv[q.id]||''}</textarea>
      `).join('')}
    </div>

    <div class="task-section">
      <h4>✏️ Answers from the Other Team</h4>
      <label class="field-label">Other team's name</label>
      <input class="field" type="text" id="qz_other" placeholder="Other team's name" value="${sv['other_team']||''}">
      <label class="field-label">Their answers (copy or summarise here)</label>
      <textarea class="field" id="qz_ans" placeholder="Write or paste the other team's answers here..." style="min-height:100px">${sv['other_answers']||''}</textarea>
      <label class="field-label">How many did they get right? (out of 5)</label>
      <input class="field" type="text" id="qz_score" placeholder="e.g. 4 / 5" value="${sv['other_score']||''}">
    </div>

    <div class="scoring-box">🏆 Scoring: Question quality <span>15 pts</span> · Difficulty level <span>10 pts</span> · Grading other team <span>15 pts</span> = <span>40 pts total</span></div>
    ${validationBox()}
    <button class="btn-submit" onclick="submitAct(${id}, collectQuiz)">✓ Submit Activity 9</button>`;
}

function collectQuiz() {
  const ids = ['qz_q1','qz_q2','qz_q3','qz_q4','qz_q5','qz_other','qz_ans','qz_score'];
  if (!allFilled(ids)) { showValidationError('Complete your 5 questions AND fill in the other team\'s answers.'); return null; }
  const obj = {};
  ids.forEach(id => obj[id] = getVal(id));
  return obj;
}

// ─── INIT ──────────────────────────────────────────────────────────
renderGrid();
</script>
