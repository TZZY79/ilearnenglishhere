<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Results - Batch 2</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #10b981; /* Green theme for this batch */
            --secondary: #3b82f6;
            --bg: #0f172a;
            --text: #f8fafc;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #presentation-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .slide {
            position: absolute;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            width: 90%;
        }

        .slide.active {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        .score-circle {
            width: 160px;
            height: 160px;
            border: 10px solid var(--primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4.5rem;
            font-weight: 800;
            margin: 0 auto 25px;
            background: rgba(16, 185, 129, 0.1);
            box-shadow: 0 0 40px rgba(16, 185, 129, 0.3);
        }

        .name {
            font-size: 2.8rem;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .rank-tag {
            display: inline-block;
            padding: 5px 20px;
            background: var(--secondary);
            border-radius: 20px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 1rem;
        }

        /* Winner Special Styles */
        .winner-slide .score-circle {
            border-color: #fbbf24;
            color: #fbbf24;
            box-shadow: 0 0 60px rgba(251, 191, 36, 0.6);
            transform: scale(1.1);
        }

        .winner-label {
            color: #fbbf24;
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 10px;
            letter-spacing: 5px;
        }

        #start-btn {
            padding: 18px 45px;
            font-size: 1.6rem;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="presentation-container">
        <div id="intro" class="slide active">
            <h1 style="font-size: 3.5rem; margin-bottom: 0;">Exam Results</h1>
            <p style="opacity: 0.8; font-size: 1.2rem;">Batch #2 Reveal</p>
            <br>
            <button id="start-btn" onclick="startShow()">Begin Presentation</button>
        </div>
    </div>

<script>
    // Data extracted and mapped from your images
    const data = [
        { name: "Loh Tahirah", score: 67 },
        { name: "Uk Leanghong", score: 78 },
        { name: "Oeung Sothyreach", score: 79 },
        { name: "Ran Molika", score: 79 },
        { name: "Liv Moniyuthea", score: 80 },
        { name: "Hin Sokunkhery", score: 81 },
        { name: "Oeung Vimearpagna", score: 90 },
        { name: "Art Thavry", score: 91 },
        { name: "Ky Rany", score: 93 },
        { name: "Lot Nita", score: 94 },
        { name: "Kong Sovanpanha", score: 98, winner: true }
    ];

    const container = document.getElementById('presentation-container');
    let currentSlide = 0;

    function createSlides() {
        data.forEach((item, index) => {
            const slide = document.createElement('div');
            slide.className = `slide ${item.winner ? 'winner-slide' : ''}`;
            slide.id = `slide-${index}`;
            
            slide.innerHTML = `
                ${item.winner ? '<div class="winner-label">CHAMPION</div>' : ''}
                <div class="score-circle">${item.score}</div>
                <div class="name">${item.name}</div>
                <div class="rank-tag">${item.winner ? '🏆 1st Place' : 'Rank #' + (data.length - index)}</div>
            `;
            container.appendChild(slide);
        });
    }

    function startShow() {
        document.getElementById('intro').classList.remove('active');
        createSlides();
        setTimeout(nextSlide, 600);
    }

    function nextSlide() {
        if (currentSlide < data.length) {
            if (currentSlide > 0) {
                document.getElementById(`slide-${currentSlide - 1}`).classList.remove('active');
            }
            
            const activeSlide = document.getElementById(`slide-${currentSlide}`);
            activeSlide.classList.add('active');

            if (data[currentSlide].winner) {
                celebrate();
            }

            // Progression timing
            let delay = 1800; 
            if (currentSlide > 6) delay = 1400; // Speed up toward the end
            if (data[currentSlide].winner) delay = 10000; 

            currentSlide++;
            if (currentSlide <= data.length) {
                setTimeout(nextSlide, delay);
            }
        }
    }

    function celebrate() {
        var count = 200;
        var defaults = { origin: { y: 0.7 } };

        function fire(particleRatio, opts) {
          confetti(Object.assign({}, defaults, opts, {
            particleCount: Math.floor(count * particleRatio)
          }));
        }

        fire(0.25, { spread: 26, startVelocity: 55 });
        fire(0.2, { spread: 60 });
        fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
        fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
        fire(0.1, { spread: 120, startVelocity: 45 });
    }
</script>

</body>
</html>
