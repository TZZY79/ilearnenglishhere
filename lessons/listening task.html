<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gym Journey Quiz</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0e0e;
    --card: #1a1a1a;
    --accent: #f5c518;
    --accent2: #ff4d4d;
    --text: #f0f0f0;
    --muted: #888;
    --correct: #22c55e;
    --wrong: #ef4444;
    --border: #2e2e2e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    padding: 20px 16px 60px;
  }

  header {
    text-align: center;
    padding: 30px 0 24px;
    border-bottom: 2px solid var(--accent);
    margin-bottom: 32px;
  }

  header h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.4rem, 8vw, 4rem);
    letter-spacing: 3px;
    color: var(--accent);
    line-height: 1;
  }

  header p {
    margin-top: 8px;
    color: var(--muted);
    font-size: 0.9rem;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .progress-bar-wrap {
    background: var(--border);
    border-radius: 99px;
    height: 6px;
    margin-bottom: 28px;
    overflow: hidden;
  }
  .progress-bar-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 99px;
    transition: width 0.4s ease;
  }

  .score-board {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 20px;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .score-board span b { color: var(--accent); }

  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 20px;
    margin-bottom: 16px;
    position: relative;
    transition: border-color 0.3s;
  }

  .question-card.answered-correct { border-color: var(--correct); }
  .question-card.answered-wrong { border-color: var(--wrong); }

  .q-number {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem;
    color: var(--muted);
    letter-spacing: 2px;
    margin-bottom: 6px;
  }

  .q-text {
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1.5;
    margin-bottom: 16px;
  }

  .q-text .blank {
    display: inline-block;
    width: 90px;
    border-bottom: 2px solid var(--accent);
    margin: 0 4px;
  }

  /* Multiple choice */
  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .option-btn {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 16px;
    text-align: left;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .option-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .option-btn:disabled { cursor: default; }
  .option-btn.correct { border-color: var(--correct); background: rgba(34,197,94,0.12); color: var(--correct); }
  .option-btn.wrong { border-color: var(--wrong); background: rgba(239,68,68,0.1); color: var(--wrong); }

  .option-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    min-width: 22px;
    color: var(--muted);
  }

  /* Fill in blank */
  .fitb-wrap {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  .fitb-input {
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    flex: 1;
    min-width: 160px;
    outline: none;
    transition: border-color 0.2s;
  }
  .fitb-input:focus { border-color: var(--accent); }
  .fitb-input.correct { border-color: var(--correct); }
  .fitb-input.wrong { border-color: var(--wrong); }
  .fitb-input:disabled { cursor: default; }

  .submit-btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .submit-btn:hover:not(:disabled) { opacity: 0.85; }
  .submit-btn:disabled { opacity: 0.4; cursor: default; }

  /* True / False */
  .tf-wrap { display: flex; gap: 10px; }
  .tf-btn {
    flex: 1;
    background: transparent;
    border: 1.5px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 12px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tf-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .tf-btn:disabled { cursor: default; }
  .tf-btn.correct { border-color: var(--correct); background: rgba(34,197,94,0.12); color: var(--correct); }
  .tf-btn.wrong { border-color: var(--wrong); background: rgba(239,68,68,0.1); color: var(--wrong); }

  .feedback {
    margin-top: 12px;
    font-size: 0.88rem;
    font-weight: 600;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.correct-fb { color: var(--correct); }
  .feedback.wrong-fb { color: var(--wrong); }

  /* Final results */
  #results {
    display: none;
    text-align: center;
    padding: 40px 20px;
    background: var(--card);
    border-radius: 16px;
    border: 1px solid var(--border);
    margin-top: 24px;
  }
  #results h2 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3rem;
    color: var(--accent);
    letter-spacing: 3px;
  }
  #results .final-score {
    font-size: 4rem;
    font-weight: 700;
    margin: 12px 0;
  }
  #results p { color: var(--muted); margin-bottom: 24px; }
  .restart-btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: 10px;
    padding: 14px 32px;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.2rem;
    letter-spacing: 2px;
    cursor: pointer;
  }
  .restart-btn:hover { opacity: 0.85; }

  .section-divider {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.8rem;
    letter-spacing: 3px;
    color: var(--accent);
    text-transform: uppercase;
    margin: 28px 0 14px;
    padding-left: 4px;
    border-left: 3px solid var(--accent);
    padding-left: 10px;
  }
</style>
</head>
<body>

<header>
  <h1>Gym Journey Quiz</h1>
  <p>Test your knowledge — multiple choice & fill in the blank</p>
</header>

<div class="progress-bar-wrap">
  <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
</div>

<div class="score-board">
  <span>Question <b id="qCount">0</b> / <b id="qTotal">0</b> answered</span>
  <span>Score: <b id="scoreDisplay">0</b></span>
</div>

<div id="quiz-container"></div>
<div id="results">
  <h2>Results</h2>
  <div class="final-score" id="finalScore"></div>
  <p id="finalMsg"></p>
  <button class="restart-btn" onclick="restart()">Try Again</button>
</div>

<script>
const questions = [
  // ── SECTION A: HABITS & SCHEDULE ──
  {
    section: "HABITS & SCHEDULE",
    type: "fitb",
    text: 'Doing something repeatedly over time is called a ___.',
    blanks: ['pattern'],
    hint: 'Think: repeated behaviour over time'
  },
  {
    type: "mc",
    text: 'Monday and Thursday is dedicated to which workout group?',
    options: ['Legs & Core', 'Push group', 'Back & Biceps', 'Cardio only'],
    answer: 1
  },
  {
    type: "mc",
    text: 'Tuesday and Friday is for which exercises?',
    options: ['Chest & Triceps', 'Legs & Shoulders', 'Back, Biceps and Rear Delt exercises', 'Push group and Cardio'],
    answer: 2
  },
  {
    type: "tf",
    text: 'Sunday is for dillydally (doing nothing / relaxing). True or False?',
    answer: true
  },
  {
    type: "mc",
    text: 'What is the LAST thing you want to see on YouTube?',
    options: ['A workout vlog', 'A cooking channel', 'An Excel spreadsheet', 'A motivational speech'],
    answer: 2
  },
  // ── SECTION B: THE GYM STORY ──
  {
    section: "THE GYM STORY",
    type: "mc",
    text: 'What is he obsessed with?',
    options: ['Eating healthy', 'Getting stronger', 'Running marathons', 'Counting calories'],
    answer: 1
  },
  {
    type: "mc",
    text: 'What two types of changes did he go through on his gym journey?',
    options: ['Social & Emotional', 'Financial & Social', 'Physical & Mental', 'Spiritual & Physical'],
    answer: 2
  },
  {
    type: "fitb",
    text: 'What was his gym buddy\'s name? (Bonus point!) ___',
    blanks: ['kevin gwyn', 'kevin'],
    hint: 'First and last name'
  },
  {
    type: "mc",
    text: 'What did his friend tell him to do with the two 15lb dumbbells?',
    options: ['Bicep curls', 'Shoulder press', 'Chest press', 'Deadlift'],
    answer: 2
  },
  {
    type: "mc",
    text: 'What everyday bodyweight exercise is similar to a chest press?',
    options: ['Squat', 'Plank', 'Push up', 'Burpee'],
    answer: 2
  },
  {
    type: "mc",
    text: 'A chest press is perfect for which range of people?',
    options: ['Athletes only', 'Intermediates only', 'Beginners to experts', 'Advanced lifters only'],
    answer: 2
  },
  {
    type: "mc",
    text: 'After the set, what did his buddy say?',
    options: ['"Take a rest, you\'re done."', '"Okay great, now 2 more sets."', '"Let\'s do legs instead."', '"Drop the weight."'],
    answer: 1
  },
  {
    type: "mc",
    text: 'He looked at his buddy with disgust and said ___.',
    options: ['"No way!"', '"I\'m done!"', '"Dude."', '"Really?!"'],
    answer: 2
  },
  {
    type: "mc",
    text: 'The first month of training felt like what?',
    options: ['A dream', 'Heaven', 'Hell', 'Nothing special'],
    answer: 2
  },
  {
    type: "fitb",
    text: 'What does DOMS stand for? ___ ___ ___ ___',
    blanks: ['delayed onset muscle soreness', 'delay onset muscle soreness'],
    hint: '4 words — the pain you feel 1–2 days after a workout'
  },
  {
    type: "mc",
    text: 'When the pain got too much, what did he do?',
    options: ['Pushed through it', 'Switched to cardio', 'Quit', 'Took a week off'],
    answer: 2
  },
  {
    type: "mc",
    text: 'When he got severely sick, where was he?',
    options: ['At the gym', 'At work', 'In his bed', 'At the hospital'],
    answer: 2
  },
  {
    type: "mc",
    text: 'What overwhelming feeling does being sick give you?',
    options: ['Excitement', 'Fatigue / feeling lethargic', 'Hunger', 'Anger'],
    answer: 1
  },
  // ── SECTION C: WORKOUT PRINCIPLES ──
  {
    section: "WORKOUT PRINCIPLES",
    type: "mc",
    text: 'Which of these is NOT one of the 4 fun things you should be doing in your workouts?',
    options: ['Doing many exercises', 'Managing time & energy', 'Tracking perceived exertion', 'Watching YouTube tutorials between sets'],
    answer: 3
  },
  {
    type: "fitb",
    text: 'Good workout habits should be practised ___.',
    blanks: ['daily'],
    hint: 'Every single ___'
  },
];

let score = 0;
let answered = 0;
const total = questions.length;

function normalise(str) {
  return str.toLowerCase().trim().replace(/[^a-z0-9 ]/g, '');
}

function build() {
  const container = document.getElementById('quiz-container');
  document.getElementById('qTotal').textContent = total;
  document.getElementById('scoreDisplay').textContent = '0 / ' + total;

  let currentSection = null;

  questions.forEach((q, i) => {
    if (q.section && q.section !== currentSection) {
      currentSection = q.section;
      const div = document.createElement('div');
      div.className = 'section-divider';
      div.textContent = '── ' + q.section + ' ──';
      container.appendChild(div);
    }

    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = 'card-' + i;

    const num = document.createElement('div');
    num.className = 'q-number';
    num.textContent = 'Q' + (i + 1);
    card.appendChild(num);

    const qText = document.createElement('div');
    qText.className = 'q-text';
    qText.textContent = q.text;
    card.appendChild(qText);

    const feedback = document.createElement('div');
    feedback.className = 'feedback';
    feedback.id = 'fb-' + i;

    if (q.type === 'mc') {
      const opts = document.createElement('div');
      opts.className = 'options';
      const labels = ['A', 'B', 'C', 'D'];
      q.options.forEach((opt, j) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.id = 'opt-' + i + '-' + j;
        btn.innerHTML = `<span class="option-label">${labels[j]}</span>${opt}`;
        btn.addEventListener('click', () => handleMC(i, j));
        opts.appendChild(btn);
      });
      card.appendChild(opts);

    } else if (q.type === 'fitb') {
      const wrap = document.createElement('div');
      wrap.className = 'fitb-wrap';
      const inp = document.createElement('input');
      inp.className = 'fitb-input';
      inp.type = 'text';
      inp.placeholder = q.hint || 'Type your answer...';
      inp.id = 'inp-' + i;
      inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') handleFITB(i); });
      const btn = document.createElement('button');
      btn.className = 'submit-btn';
      btn.textContent = 'Check';
      btn.id = 'btn-' + i;
      btn.addEventListener('click', () => handleFITB(i));
      wrap.appendChild(inp);
      wrap.appendChild(btn);
      card.appendChild(wrap);

    } else if (q.type === 'tf') {
      const wrap = document.createElement('div');
      wrap.className = 'tf-wrap';
      ['True', 'False'].forEach((label, j) => {
        const btn = document.createElement('button');
        btn.className = 'tf-btn';
        btn.textContent = label;
        btn.id = 'tf-' + i + '-' + j;
        btn.addEventListener('click', () => handleTF(i, label === 'True'));
        wrap.appendChild(btn);
      });
      card.appendChild(wrap);
    }

    card.appendChild(feedback);
    container.appendChild(card);
  });
}

function updateProgress() {
  const pct = (answered / total) * 100;
  document.getElementById('progressBar').style.width = pct + '%';
  document.getElementById('qCount').textContent = answered;
  document.getElementById('scoreDisplay').textContent = score + ' / ' + total;
  if (answered === total) showResults();
}

function markCard(i, correct) {
  const card = document.getElementById('card-' + i);
  card.classList.add(correct ? 'answered-correct' : 'answered-wrong');
  const fb = document.getElementById('fb-' + i);
  fb.classList.add('show', correct ? 'correct-fb' : 'wrong-fb');
  if (correct) {
    fb.textContent = '✓ Correct!';
    score++;
  } else {
    const q = questions[i];
    let ans = '';
    if (q.type === 'mc') ans = q.options[q.answer];
    else if (q.type === 'fitb') ans = q.blanks[0];
    else if (q.type === 'tf') ans = q.answer ? 'True' : 'False';
    fb.textContent = '✗ Incorrect. Answer: ' + ans;
  }
  answered++;
  updateProgress();
}

function handleMC(i, chosen) {
  const q = questions[i];
  document.querySelectorAll('[id^="opt-' + i + '-"]').forEach(btn => btn.disabled = true);
  const correct = chosen === q.answer;
  const chosen_btn = document.getElementById('opt-' + i + '-' + chosen);
  const correct_btn = document.getElementById('opt-' + i + '-' + q.answer);
  chosen_btn.classList.add(correct ? 'correct' : 'wrong');
  if (!correct) correct_btn.classList.add('correct');
  markCard(i, correct);
}

function handleFITB(i) {
  const q = questions[i];
  const inp = document.getElementById('inp-' + i);
  const btn = document.getElementById('btn-' + i);
  const userVal = normalise(inp.value);
  const correct = q.blanks.some(b => normalise(b) === userVal || userVal.includes(normalise(b).split(' ')[0]));
  inp.disabled = true;
  btn.disabled = true;
  inp.classList.add(correct ? 'correct' : 'wrong');
  markCard(i, correct);
}

function handleTF(i, chosen) {
  const q = questions[i];
  ['True','False'].forEach((label, j) => {
    document.getElementById('tf-' + i + '-' + j).disabled = true;
  });
  const correct = chosen === q.answer;
  const chosenIdx = chosen ? 0 : 1;
  const correctIdx = q.answer ? 0 : 1;
  document.getElementById('tf-' + i + '-' + chosenIdx).classList.add(correct ? 'correct' : 'wrong');
  if (!correct) document.getElementById('tf-' + i + '-' + correctIdx).classList.add('correct');
  markCard(i, correct);
}

function showResults() {
  const pct = Math.round((score / total) * 100);
  document.getElementById('results').style.display = 'block';
  document.getElementById('finalScore').textContent = score + ' / ' + total + ' (' + pct + '%)';
  let msg = pct >= 80 ? '💪 Excellent work — you really know this stuff!' :
            pct >= 60 ? '👊 Solid effort — a little more review and you\'ll nail it!' :
                        '📖 Keep going — review the notes and try again!';
  document.getElementById('finalMsg').textContent = msg;
  document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
}

function restart() {
  location.reload();
}

build();
</script>
</body>
</html>
