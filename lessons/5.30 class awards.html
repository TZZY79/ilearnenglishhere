<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Score Leaderboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary: #6366f1;
            --secondary: #a855f7;
            --bg: #0f172a;
            --text: #f8fafc;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #presentation-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .slide {
            position: absolute;
            opacity: 0;
            transform: translateY(50px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
            width: 80%;
        }

        .slide.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border: 8px solid var(--primary);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 4rem;
            font-weight: 800;
            margin: 0 auto 20px;
            background: rgba(99, 102, 241, 0.1);
            box-shadow: 0 0 30px rgba(99, 102, 241, 0.3);
        }

        .name {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .rank {
            color: var(--secondary);
            font-weight: bold;
            font-size: 1.2rem;
        }

        /* Winner Special Styles */
        .winner-title {
            font-size: 1.5rem;
            background: linear-gradient(to right, #fbbf24, #f59e0b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 900;
            margin-bottom: 1rem;
        }

        .winner-slide .score-circle {
            border-color: #fbbf24;
            box-shadow: 0 0 50px rgba(251, 191, 36, 0.5);
            transform: scale(1.2);
            margin-bottom: 40px;
        }

        #start-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        #start-btn:hover {
            transform: scale(1.05);
            background: var(--secondary);
        }
    </style>
</head>
<body>

    <div id="presentation-container">
        <div id="intro" class="slide active">
            <h1 style="font-size: 3rem;">Class Score Reveal</h1>
            <p>Ready to see the results?</p>
            <button id="start-btn" onclick="startShow()">Start Countdown</button>
        </div>
    </div>

<script>
    const data = [
        { name: "Pov Sreyneth", score: 75 },
        { name: "Sok Kanhaan", score: 79 },
        { name: "Ly Huykhim", score: 79 },
        { name: "Huot Yly (Lee)", score: 83 },
        { name: "Phay Rattanakkevin", score: 84 },
        { name: "Muon Vichet", score: 84 },
        { name: "Lao Vatanak", score: 85 },
        { name: "Luch Sereysavday", score: 87 },
        { name: "Roueb Soneta", score: 87 },
        { name: "Vong Sotheachiviny", score: 88 },
        { name: "Chea Vandy", score: 88 },
        { name: "Khom Panhavata", score: 88 },
        { name: "Pal Reaksmey", score: 89 },
        { name: "Chuon Sovanroth", score: 90 },
        { name: "Trinh Sopheap (Pip)", score: 92 },
        { name: "Chantha Sotheary", score: 92 },
        { name: "Houth Buntheng", score: 92 },
        { name: "Theng Malipin", score: 93 },
        { name: "Seth Sereyroath", score: 93 },
        { name: "Sopheak Chansokmeng", score: 94 },
        { name: "Phou Chermeng", score: 94 },
        { name: "Vireak Jame", score: 94 },
        { name: "Phak Pisethmongkol", score: 95 },
        { name: "Duk Socheata", score: 95 },
        { name: "Chheang Sokkim", score: 96 },
        { name: "Chhen Channthona", score: 97 },
        { name: "Teng Niza", score: 97 },
        { name: "Cheub Dalin", score: 98 },
        { name: "Yam Soksopheakna", score: 99, winner: true }
    ];

    const container = document.getElementById('presentation-container');
    let currentSlide = 0;

    function createSlides() {
        data.forEach((item, index) => {
            const slide = document.createElement('div');
            slide.className = `slide ${item.winner ? 'winner-slide' : ''}`;
            slide.id = `slide-${index}`;
            
            slide.innerHTML = `
                ${item.winner ? '<div class="winner-title">⭐ TOP SCORER ⭐</div>' : ''}
                <div class="score-circle">${item.score}</div>
                <div class="name">${item.name}</div>
                <div class="rank">Rank #${data.length - index}</div>
            `;
            container.appendChild(slide);
        });
    }

    function startShow() {
        document.getElementById('intro').classList.remove('active');
        createSlides();
        setTimeout(nextSlide, 500);
    }

    function nextSlide() {
        if (currentSlide < data.length) {
            if (currentSlide > 0) {
                document.getElementById(`slide-${currentSlide - 1}`).classList.remove('active');
            }
            
            const activeSlide = document.getElementById(`slide-${currentSlide}`);
            activeSlide.classList.add('active');

            // If it's the winner, throw confetti
            if (data[currentSlide].winner) {
                celebrate();
            }

            // Speed up as we get closer to the winner
            let delay = 1500 - (currentSlide * 40); 
            if (delay < 600) delay = 600;
            if (data[currentSlide].winner) delay = 10000; // Stay on winner

            currentSlide++;
            if (currentSlide <= data.length) {
                setTimeout(nextSlide, delay);
            }
        }
    }

    function celebrate() {
        const duration = 5 * 1000;
        const animationEnd = Date.now() + duration;
        const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

        function randomInRange(min, max) {
          return Math.random() * (max - min) + min;
        }

        const interval = setInterval(function() {
          const timeLeft = animationEnd - Date.now();

          if (timeLeft <= 0) {
            return clearInterval(interval);
          }

          const particleCount = 50 * (timeLeft / duration);
          confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
          confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
        }, 250);
    }
</script>

</body>
</html>
