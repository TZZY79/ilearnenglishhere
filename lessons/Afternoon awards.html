<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clean Score Reveal</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --gold: #fbbf24;
            --navy: #0f172a;
            --white: #f8fafc;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Roboto', sans-serif;
            background-color: var(--navy);
            color: var(--white);
            overflow: hidden;
        }

        #presentation-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .slide {
            position: absolute;
            width: 100%;
            text-align: center;
            /* The key fix: opacity + visibility + display none logic */
            opacity: 0;
            visibility: hidden; 
            transition: opacity 0.5s ease-in-out, visibility 0.5s;
        }

        .slide.active {
            opacity: 1;
            visibility: visible;
        }

        .score-box {
            font-family: 'Oswald', sans-serif;
            font-size: 8rem;
            color: var(--gold);
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(251, 191, 36, 0.4);
        }

        .student-name {
            font-size: 3.5rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .status-bar {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #94a3b8;
            letter-spacing: 5px;
        }

        #start-btn {
            background: var(--gold);
            color: var(--navy);
            border: none;
            padding: 20px 60px;
            font-size: 2rem;
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 10px 0 #b45309;
            transition: all 0.1s;
        }

        #start-btn:active {
            transform: translateY(5px);
            box-shadow: 0 5px 0 #b45309;
        }
    </style>
</head>
<body>

    <div id="presentation-container">
        <div id="intro" class="slide active">
            <h1 style="font-size: 4rem;">RESULTS REVEAL</h1>
            <p style="margin-bottom: 40px; opacity: 0.7;">Click below to begin the countdown</p>
            <button id="start-btn" onclick="runPresentation()">START</button>
        </div>
    </div>

<script>
    // Combined list from your images
    const students = [
        { name: "Sovan", score: 74 },
        { name: "Pov Sreyneth", score: 75 },
        { name: "Uk Leanghong", score: 78 },
        { name: "Sok Kanhaan", score: 79 },
        { name: "Ly Huykhim", score: 79 },
        { name: "Thong Suyhor", score: 79 },
        { name: "Hor Sivgech (Zoe)", score: 80 },
        { name: "Hin Sokunkhery", score: 81 },
        { name: "Meas Koum", score: 82 },
        { name: "Choem Kunthea", score: 83 },
        { name: "Phay Rattanakkevin", score: 84 },
        { name: "Seng Roth", score: 85 },
        { name: "Jane", score: 85 },
        { name: "Vong Sotheachiviny", score: 88 },
        { name: "Chea Vandy", score: 88 },
        { name: "Van TholSomavotey", score: 89 },
        { name: "Chuon Sovanroth", score: 90 },
        { name: "Art Thavry", score: 91 },
        { name: "Ky Rany", score: 93 },
        { name: "Lot Nita", score: 94 },
        { name: "Vireak Jame", score: 94 },
        { name: "Dom", score: 96 },
        { name: "Chheang Sokkim", score: 96 },
        { name: "Teng Niza", score: 97 },
        { name: "Kong Sovanpanha", score: 98 },
        { name: "Yam Soksopheakna", score: 99, winner: true }
    ];

    const container = document.getElementById('presentation-container');

    function buildSlides() {
        students.forEach((s, i) => {
            const div = document.createElement('div');
            div.className = 'slide';
            div.id = `slide-${i}`;
            div.innerHTML = `
                <div class="score-box">${s.score}</div>
                <div class="student-name">${s.name}</div>
                <div class="status-bar">${s.winner ? "🏆 FINAL SCORE 🏆" : "REVEALING..."}</div>
            `;
            container.appendChild(div);
        });
    }

    let currentIndex = 0;

    function runPresentation() {
        document.getElementById('intro').classList.remove('active');
        buildSlides();
        setTimeout(showNext, 500);
    }

    function showNext() {
        if (currentIndex < students.length) {
            // Remove 'active' from previous slide
            if (currentIndex > 0) {
                document.getElementById(`slide-${currentIndex - 1}`).classList.remove('active');
            }

            // Show current slide
            const currentSlide = document.getElementById(`slide-${currentIndex}`);
            currentSlide.classList.add('active');

            if (students[currentIndex].winner) {
                confetti({
                    particleCount: 150,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#fbbf24', '#ffffff', '#f59e0b']
                });
            }

            // Speed logic: 2 seconds for early slides, 1.2 seconds for top 5
            let delay = (currentIndex > students.length - 6) ? 1200 : 2000;
            
            currentIndex++;
            if (currentIndex <= students.length) {
                setTimeout(showNext, delay);
            }
        }
    }
</script>

</body>
</html>
